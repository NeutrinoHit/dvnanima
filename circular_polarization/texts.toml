fEN = '''$\mathbf{E}_L=(\cos(\omega t-kz),\ -\sin(\omega t-kz),\ 0)$'''
fmix = '''$\boldsymbol{\varepsilon}=a_R\boldsymbol{\varepsilon}_R+a_L\boldsymbol{\varepsilon}_L$'''
axes = '''полуоси'''
