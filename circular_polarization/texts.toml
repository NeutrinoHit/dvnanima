# All the words and formulas of the film (the same keys in both languages); formulas are matplotlib mathtext (LaTeX), words stay outside $...$.

[en]
title = '''Circular polarization'''
sub = '''$\mathbf{E}$ of a wave moving along $z$'''
recv = '''receiver's view'''
conv = '''convention of the book (as in particle physics):
right = clockwise for the source looking along
the wave = positive helicity; optics counts from
the receiver and calls this wave left'''
src = '''source's view'''
ccw = '''counterclockwise'''
cw = '''clockwise'''
snap = '''snapshot in space: a left-handed helix'''
time = '''in time at fixed $z$: a right-handed rotation about $\mathbf{k}$'''
snap_neg = '''snapshot in space: a right-handed helix'''
time_neg = '''in time at fixed $z$: a left-handed rotation about $\mathbf{k}$'''
pos = '''right circular polarization'''
neg = '''left circular polarization'''
names_pos = '''positive helicity, $S_z=+\hbar$'''
names_neg = '''negative helicity, $S_z=-\hbar$'''
s1 = '''right: $\boldsymbol{\varepsilon}_R\propto(1,\,i,\,0)$, for the source $\mathbf{E}$ rotates clockwise (for the receiver counterclockwise); the photons have $S_z=+\hbar$'''
s2 = '''left: $\boldsymbol{\varepsilon}_L\propto(1,\,-i,\,0)$, the rotation is reversed; the photons have $S_z=-\hbar$'''
s3a = '''equal amplitudes: linear polarization; the relative phase $\delta$ turns the axis'''
s3b = '''unequal amplitudes: an ellipse with the semi-axes $a_R+a_L$ and $|a_R-a_L|$'''
s3c = '''$a_L\to0$: a circle'''
s4 = '''the wave is a flux of photons, each with the spin projection $S_z=+\hbar$ or $-\hbar$ on the direction of motion'''
linear = '''linear'''
ellipse = '''elliptical'''
circle = '''circular'''
fP = '''$\boldsymbol{\varepsilon}_R=\frac{1}{\sqrt{2}}(1,\,i,\,0)$'''
fN = '''$\boldsymbol{\varepsilon}_L=\frac{1}{\sqrt{2}}(1,\,-i,\,0)$'''
fEP = '''$\mathbf{E}_R=(\cos(\omega t-kz),\ \sin(\omega t-kz),\ 0)$'''
fEN = '''$\mathbf{E}_L=(\cos(\omega t-kz),\ -\sin(\omega t-kz),\ 0)$'''
fmix = '''$\boldsymbol{\varepsilon}=a_R\boldsymbol{\varepsilon}_R+a_L\boldsymbol{\varepsilon}_L$'''
axes = '''semi-axes'''
tilt = '''tilt of the major axis'''
spin = '''$S_z=\pm\hbar$'''
snap_sz = '''$S_z=+\hbar$'''
sz_pos = '''$S_z=+\hbar$'''
sz_neg = '''$S_z=-\hbar$'''
leg_R = '''● $\mathbf{E}_R$'''
leg_L = '''● $\mathbf{E}_L$'''
leg_sum = '''● $\mathbf{E}_R+\mathbf{E}_L$'''
e_label = '''$\mathbf{E}$'''
axis_z = '''$z,\ \mathbf{k}$'''

