rx_3 = '''$X_1$ is the depth of the first interaction'''
rx_4 = '''all the particles of a generation split at the same depth'''
rd_t = '''muons from pion decays'''
rd_1 = '''$E_\pi>E_{dec}$: the pion interacts again'''
rd_2 = '''$E_\pi\leq E_{dec}=<edec>$ GeV: $\pi^\pm\to\mu^\pm\nu$'''
