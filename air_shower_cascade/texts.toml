p1 = '''A cosmic-ray proton of energy $E_0=<e>$ eV falls on the atmosphere. The depth $X$ is the mass of air (g/cm$^2$) on its way.'''
p2 = '''First interaction at the depth $X_1$: the proton breaks up into pions, the energy is shared equally between them.'''
p3 = '''Neutral pions decay at once into photons; the charged ones fly on and interact again: the cascade branches.'''
p4 = '''Every photon starts an electromagnetic cascade, $\gamma\to e^+e^-$, $e^\pm\to e^\pm\gamma$: the number of particles grows almost exponentially (a straight line on the log scale).'''
p5 = '''Shower maximum: where $E<E_c$ ionisation wins, the multiplication stops. Heitler's $N_{max}=E_0/E_c$ is an upper estimate.'''
p6 = '''Beyond the maximum the electromagnetic part dies out. Charged pions with $E\leq E_{dec}$ have decayed: muons and neutrinos reach the ground.'''
p7 = '''At the ground what is left is $N_\mu=<nmu>$ muons and the remains of the electromagnetic cascade, $N(e^\pm+\gamma)=<nem>$.'''
rh_t = '''hadronic interaction'''
rh_1 = '''$p\to<nch>\,\pi^\pm+<npi0>\,\pi^0$'''
