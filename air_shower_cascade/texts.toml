t1 = '''Heitler's toy model: one photon of energy $E_0=<e0>$ GeV enters the air. $X_0=<x0>$ g/cm$^2$ is the radiation length.'''
t2 = '''After the depth $d=X_0\ln2$ every particle splits in two with half the energy: $\gamma\to e^+e^-$, $e^\pm\to e^\pm\gamma$. After $n$ steps there are $N=2^n$ particles of $E_0/2^n$ each.'''
t3 = '''At $E=E_c$ ionisation wins over radiation: the particles stop multiplying and are absorbed within about $X_0$.'''
t4 = '''The maximum: $N_{max}=E_0/E_c$ at $X_{max}=X_0\ln(E_0/E_c)$. The same rule, with a random depth of every splitting, is used for the real shower.'''
ta_t = '''Heitler's rule'''
ta_1 = '''$e^\pm\to e^\pm\gamma$,   $\gamma\to e^+e^-$'''
ta_2 = '''the particle splits after $d=X_0\ln2=<d>$ g/cm$^2$'''
ta_3 = '''the energy is shared equally: $E_n=E_0/2^n$'''
ta_4 = '''$N_n=2^n$;  here $E_0=2^{<n>}E_c$'''
tb_t = '''result'''
tb_1 = '''$E_n=E_c$ after $n_c=\log_2(E_0/E_c)=<n>$ steps'''
tb_2 = '''$N_{max}=2^{n_c}=E_0/E_c=<nmax>$'''
tb_3 = '''$X_{max}=n_c\,d=X_0\ln(E_0/E_c)$'''
tb_4 = '''$=<xmax>$ g/cm$^2$'''
g1 = '''At the ground the shower is a thin disc of particles around its axis. A detector array samples it: a station of $1\,$m$^2$ every 10 m counts the particles that hit it.'''
g2 = '''The counts fall steeply with the distance $r$ from the core; the electrons are concentrated within the Molière radius $r_M\approx<r>$ m. Green: stations hit by a muon.'''
g3 = '''Density of $e^\pm$: Monte Carlo (blue), the NKG formula (dashed), the stations (dots). The muons fall off more slowly: the ratio $\rho_\mu/\rho_e$ grows with the distance from the core.'''
