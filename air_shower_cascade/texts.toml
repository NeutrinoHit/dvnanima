gr_l_mu = '''$\mu^\pm$: simulation'''
gr_l_st = '''stations (hits/area)'''
l1 = '''The shower is also seen in its light. Fluorescence: $e^\pm$ excite nitrogen molecules, the ultraviolet light is proportional to the energy deposit $dE/dX$, so a telescope sees this curve.'''
l2 = '''Cherenkov light: $e^\pm$ above the threshold $E_{th}$ radiate at the angle $\cos\theta_c=1/n$; in air $n-1$ is proportional to the density, so with altitude the threshold grows and the angle shrinks.'''
lt_fl = '''fluorescence: energy deposit $dE/dX$, TeV per g/cm$^2$'''
lt_int = '''$\int\!\frac{dE}{dX}dX=<f>\,E_0$ (the rest: $\mu$, $\nu$)'''
