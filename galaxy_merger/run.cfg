[model]
stars = 60000          ; stars in the first galaxy
mass_ratio = 0.8       ; mass of the second galaxy / first galaxy
halo = 0.25            ; Plummer scale of the first halo
rdisk = 0.9            ; disk radius of the first galaxy
pericentre = 1.0       ; pericentre of the Kepler start orbit
ecc = 0.6              ; eccentricity of the start orbit
theta0 = -2.6          ; start true anomaly [rad]
lnl = 0.6              ; Coulomb logarithm: strength of dynamical friction
incl1 = 25             ; disk inclinations and nodes [deg]
node1 = 0
incl2 = -55
node2 = 30
seed = 7

[integration]
dt = 0.004             ; leapfrog time step
duration = 30.0        ; simulated time
frame_time = 0.05      ; simulated time per video frame

[video]
fps = 30
pixels = 1080
hold = 12.0            ; seconds of slow zoom on the remnant after the merger
hold_zoom = 1.6        ; zoom factor reached at the end of the hold
hold_spin = 12.0       ; extra camera rotation during the hold [deg]
view = 95              ; initial camera rotation [deg]
spin = 25              ; camera rotation during the merger [deg]
reach = 1.15           ; view half-width = farthest centre + reach * disk radius
min_width = 1.3
cam_smooth = 30        ; camera smoothing [frames]

[tone]
stretch = 200          ; arcsinh stretch of the brightness
black = 0.03           ; black point
bright = 2.0           ; reference brightness (1 = densest place of the film is white)
end_exposure = 5.0     ; reference brightness at the end relative to the start
exposure_from = 0.55   ; position in the film (0..1) where the exposure starts to change

[output]
out = media/videos/galaxy_merger/1080p30/GalaxyMerger.mp4
poster =
poster_time = 0.57
last_frame =
sheet =
