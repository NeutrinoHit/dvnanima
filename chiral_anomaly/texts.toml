[ru]
title = '''Киральная аномалия'''
h0 = '''Киральная аномалия:
откуда берутся частицы?'''
h0s = '''море Дирака, поток уровней и обрезание'''
h1 = '''Безмассовый фермион и его море'''
h1s = '''правые и левые, заполненный вакуум'''
h2 = '''Электрическое поле гонит уровни'''
h2s = '''считаем уровни, пересекающие $E=0$'''
h3 = '''Что считать, решает обрезание'''
h3s = '''векторный заряд должен сохраняться'''
h4 = '''От 1+1 к 3+1 измерениям'''
h4s = '''уровни Ландау: стопка одинаковых лестниц'''
h5 = '''Треугольник и нейтральный пион'''
h5s = '''та же аномалия в распаде $\pi^0\to\gamma\gamma$'''
c1a = '''безмассовый фермион в одном измерении: правые движутся с $E=+p$, левые с $E=-p$'''
c1b = '''на кольце длиной $L$ импульс квантуется, $p=2\pi n/L$: каждая ветвь есть лестница уровней'''
c1c = '''вакуум: заполнены все уровни с $E<0$, море Дирака; выше $E=0$ всё пусто'''
c1d = '''поля нет, и ничего не меняется: $N_R$ и $N_L$ (частицы минус дырки), а значит $Q=N_R+N_L$ и $Q_5=N_R-N_L$, сохраняются'''
c2a = '''включим электрическое поле вдоль кольца (растущий магнитный поток сквозь него): $p\to p+eEt$, все уровни сдвигаются'''
c2b = '''правые уровни поднимаются через $E=0$: заполненные уровни становятся частицами.
Левые опускаются: пустые уровни становятся дырками'''
c2c = '''никаких столкновений нет: уровни сдвинулись, а электроны остались на своих уровнях.
В каждой ветви за единицу времени пересекают $E=0$ ровно $eEL/2\pi$ уровней'''
c2d = '''векторный заряд $Q$ постоянен, аксиальный растёт: $\dot Q_5=eEL/\pi$,
то есть $\partial_\mu j_5^\mu=eE/\pi$ на единицу длины'''
c2e = '''через период $T$ спектр повторяется, а состояние нет: на одну частицу и одну дырку больше'''
c3a = '''бесконечное море пересчитать нельзя: оставим уровни с $|E|<\Lambda$. Заполненные уровни входят в правую ветвь снизу
и уходят из левой ветви'''
c3b = '''число заполненных уровней $N_R+N_L$ постоянно; разность растёт и не зависит от $\Lambda$'''
c3c = '''фиксированный набор уровней сохраняет $Q_5$, но дно моря движется вместе с потенциалом $A$:
у вакуума появляется ток, зависящий от калибровки'''
c3d = '''калибровочную инвариантность нарушать нельзя: регуляризация сохраняет $j^\mu$, а платит $j_5^\mu$'''
c3e = '''кристалл есть регуляризация без бесконечностей: две ветви это две ферми-точки одной зоны, $E=\sin ka$'''
c3f = '''заполненные уровни перетекают от левой точки к правой через зону: число электронов постоянно, $N_R-N_L$ растёт'''
c3g = '''при периоде решётки $a\to0$ левая точка уходит на бесконечность: частицы будто возникают из ничего'''
c4a = '''в магнитном поле $B$ есть уровни Ландау, на каждом $eB/2\pi$ состояний на единицу площади, $N_\phi=eBS/2\pi$ на площади $S$'''
c4b = '''нижний уровень есть одна киральная ветвь, $E=+p_z$ (правые) или $E=-p_z$ (левые): та же лестница 1+1'''
c4c = '''высшие уровни, $E=\pm\sqrt{p_z^2+2neB}$, имеют щель: ничто не пересекает $E=0$'''
c4d = '''$\mathbf{E}\parallel\mathbf{B}$ сдвигает сразу все $N_\phi$ лестниц: каждое пересечение происходит $N_\phi$ раз'''
c4e = '''скорость 1+1 на единицу длины $eE/2\pi$, умноженная на плотность лестниц $eB/2\pi$: аномалия в 3+1 измерениях'''
c5a = '''тот же результат на языке диаграмм Фейнмана: аксиальный ток $j_5^\mu$ рождает пару фермионов,
которая превращается в два фотона, это треугольник'''
c5b = '''регуляризация, сохраняющая $j^\mu$, даёт $\partial_\mu j_5^\mu=\frac{2\alpha}{\pi}\,\mathbf{E}\!\cdot\!\mathbf{B}$, оператор, рождающий два фотона'''
c5c = '''для нейтрального пиона кварки $u$ и $d$ дают вес $\frac{1}{2}$: $\partial_\mu j_5^{\mu 3}=\frac{\alpha}{\pi}\,\mathbf{E}\!\cdot\!\mathbf{B}$, отсюда распад $\pi^0\to\gamma\gamma$'''
c5d = '''ширина $@G@$ эВ согласуется с измеренной $@Gm@\pm@dG@$ эВ; без аномалии пион жил бы примерно в тысячу раз дольше'''
answer_q = '''Откуда берутся частицы?'''
answer = '''Вакуум есть заполненное море. Поле сдвигает его уровни.
Какие уровни считать, решает регуляризация,
сохраняющая электрический заряд.'''
f1a = '''$Q=N_R+N_L,\qquad Q_5=N_R-N_L$'''
f1b = '''классически: $\partial_\mu j^\mu=0,\qquad \partial_\mu j_5^\mu=0$'''
f2a = '''$k_n(t)=\dfrac{2\pi n}{L}+eEt$'''
f2b = '''$N_R=-N_L=\dfrac{eEL}{2\pi}\,t$'''
