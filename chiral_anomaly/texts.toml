[en]
title = '''The chiral anomaly'''
h0 = '''The chiral anomaly:
where do the particles come from?'''
h0s = '''the Dirac sea, a flow of levels and the cut-off'''
h1 = '''A massless fermion and its sea'''
h1s = '''right and left movers, the filled vacuum'''
h2 = '''An electric field makes the levels flow'''
h2s = '''counting the levels that cross $E=0$'''
h3 = '''The cut-off decides what is counted'''
h3s = '''the vector charge must be kept'''
h4 = '''From 1+1 to 3+1 dimensions'''
h4s = '''Landau levels: a stack of identical ladders'''
h5 = '''The triangle and the neutral pion'''
h5s = '''the same anomaly in the decay $\pi^0\to\gamma\gamma$'''
c1a = '''a massless fermion in one dimension: right-handed movers have $E=+p$, left-handed movers have $E=-p$'''
c1b = '''on a ring of length $L$ the momentum is quantised, $p=2\pi n/L$: each branch is a ladder of levels'''
c1c = '''the vacuum: every level with $E<0$ is filled, the Dirac sea; above $E=0$ everything is empty'''
c1d = '''no field, no change: $N_R$ and $N_L$ (particles minus holes), hence $Q=N_R+N_L$ and $Q_5=N_R-N_L$, are conserved'''
c2a = '''switch on an electric field along the ring (a growing magnetic flux through it): $p\to p+eEt$, every level slides'''
c2b = '''right-handed levels climb through $E=0$: filled levels become particles.
Left-handed levels descend: empty levels become holes'''
c2c = '''no collision made them: the levels moved, the electrons stayed in their levels.
In each branch $eEL/2\pi$ levels cross $E=0$ per unit time'''
c2d = '''the vector charge $Q$ is constant, the axial charge grows: $\dot Q_5=eEL/\pi$,
that is $\partial_\mu j_5^\mu=eE/\pi$ per unit length'''
c2e = '''after the period $T$ the spectrum repeats itself, the state does not: one more particle and one more hole'''
c3a = '''an infinite sea cannot be counted: keep the levels with $|E|<\Lambda$. Filled levels enter the right branch at the bottom
and leave the left branch there'''
c3b = '''the number of filled levels $N_R+N_L$ is constant; the difference grows and does not depend on $\Lambda$'''
c3c = '''a fixed set of levels keeps $Q_5$, but the floor of the sea moves with the potential $A$:
the vacuum gets a current that depends on the gauge'''
c3d = '''gauge invariance cannot be given up: the regularisation keeps $j^\mu$, and $j_5^\mu$ pays'''
c3e = '''a crystal is a regularisation without infinities: the two branches are the two Fermi points of one band, $E=\sin ka$'''
c3f = '''filled levels flow from the left point to the right point through the band: the number of electrons is constant, $N_R-N_L$ grows'''
c3g = '''for the lattice spacing $a\to0$ the left point goes to infinity: the particles seem to appear from nowhere'''
c4a = '''in a magnetic field $B$: Landau levels, each with $eB/2\pi$ states per unit area, $N_\phi=eBS/2\pi$ in an area $S$'''
c4b = '''the lowest level is one chiral branch, $E=+p_z$ (right) or $E=-p_z$ (left): the same 1+1 ladder'''
c4c = '''higher levels, $E=\pm\sqrt{p_z^2+2neB}$, have a gap: nothing crosses $E=0$'''
c4d = '''$\mathbf{E}\parallel\mathbf{B}$ shifts all $N_\phi$ ladders at once: every crossing happens $N_\phi$ times'''
c4e = '''the 1+1 rate $eE/2\pi$ per unit length times the density of ladders $eB/2\pi$: the anomaly in 3+1 dimensions'''
c5a = '''the same result in the language of Feynman diagrams: the axial current $j_5^\mu$ creates a fermion pair
that turns into two photons, the triangle'''
c5b = '''the regularisation that keeps $j^\mu$ conserved gives $\partial_\mu j_5^\mu=\frac{2\alpha}{\pi}\,\mathbf{E}\!\cdot\!\mathbf{B}$, an operator that creates two photons'''
c5c = '''for the neutral pion the $u$ and $d$ quarks give the weight $\frac{1}{2}$: $\partial_\mu j_5^{\mu 3}=\frac{\alpha}{\pi}\,\mathbf{E}\!\cdot\!\mathbf{B}$, hence the decay $\pi^0\to\gamma\gamma$'''
c5d = '''the width $@G@$ eV agrees with the measured $@Gm@\pm@dG@$ eV; without the anomaly the pion would live about a thousand times longer'''
answer_q = '''Where do the particles come from?'''
answer = '''The vacuum is a filled sea. The field shifts its levels.
The regularisation that conserves electric charge
decides which levels are counted.'''
f1a = '''$Q=N_R+N_L,\qquad Q_5=N_R-N_L$'''
f1b = '''classically: $\partial_\mu j^\mu=0,\qquad \partial_\mu j_5^\mu=0$'''
f2a = '''$k_n(t)=\dfrac{2\pi n}{L}+eEt$'''
f2b = '''$N_R=-N_L=\dfrac{eEL}{2\pi}\,t$'''
f2c = '''$\dot Q=0,\qquad \dot Q_5=\dfrac{eEL}{\pi}$'''
f2d = '''$\partial_\mu j^\mu=0,\qquad \partial_\mu j_5^\mu=\dfrac{e}{\pi}\,E$'''
f3a = '''$N_R+N_L=\mathrm{const},\qquad N_R-N_L=\dfrac{eEL}{\pi}\,t$'''
f3b = '''$\dot Q_5=0,\qquad j_{\mathrm{vac}}\propto A\neq0$'''
f3c = '''$E(k)=\sin ka,\qquad N_e=\mathrm{const}$'''
f4a = '''$N_\phi=\dfrac{eB}{2\pi}\,S$'''
f4b = '''$\dot n_R=\dfrac{eB}{2\pi}\cdot\dfrac{eE}{2\pi}$'''
f4c = '''$\dot n_5=2\,\dfrac{eB}{2\pi}\,\dfrac{eE}{2\pi}=\dfrac{e^2}{2\pi^2}\,\mathbf{E}\!\cdot\!\mathbf{B}=\dfrac{2\alpha}{\pi}\,\mathbf{E}\!\cdot\!\mathbf{B}$'''
r5a = '''$\partial_\mu j_5^\mu=\dfrac{e^2}{2\pi^2}\,\mathbf{E}\!\cdot\!\mathbf{B}=\dfrac{2\alpha}{\pi}\,\mathbf{E}\!\cdot\!\mathbf{B}$'''
r5b = '''$\partial_\mu j_5^{\mu 3}=\dfrac{\alpha}{\pi}\,\mathbf{E}\!\cdot\!\mathbf{B},\qquad N_c\sum_f t_3Q_f^2=\dfrac{1}{2}$'''
r5c = '''$\Gamma(\pi^0\to\gamma\gamma)=\dfrac{\alpha^2m_\pi^3}{64\pi^3f_\pi^2}=@G@$ eV'''
