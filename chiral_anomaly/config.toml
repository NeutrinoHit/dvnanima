formula_row = 0.075
caption_pos = [0.03, 0.025]
answer_q_pos = [0.5, 0.60]
answer_pos = [0.5, 0.44]
counter_x = 0.825
counter_y = 0.60
counter_row = 0.085
card_title_y = 0.54
card_subtitle_y = 0.41
card_number_y = 0.62
card_chapter_y = 0.50
card_chapter_sub_y = 0.41

[fonts]
