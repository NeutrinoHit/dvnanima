# Every number of the film "The chiral anomaly: where do the particles come from?" lives here (the script contains only algorithms).
# Override on the command line:  --config other.toml   or   --set part2.rate=0.3 --set style.background='"#000000"'
# Units: "film s" are seconds of the content (the chapter cards are inserted by the timeline). Energies and momenta of the levels are in units of the
# level spacing 2 pi / L (the drawing); figure fractions are fractions of the width / height of the frame; font sizes are points at 720 p
# (they scale with the height); marker areas are pt^2 at 720 p.

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 22
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.6
reference_height = 720

[physics]
spacing = 1.0                     # 2 pi / L, the unit of momentum and energy of the drawing
theta = 0.5                       # twist of the quantisation: no level exactly at E = 0
charge = 1.0                      # e
n_labels = 40                     # the labels n = -n_labels .. n_labels - 1 are enough to fill the view

[style]
background = "#03060c"
text = [0.88, 0.93, 1.0]
dim = [0.60, 0.68, 0.80]
warm = [1.00, 0.55, 0.40]         # right-handed (R)
cold = [0.40, 0.72, 1.00]         # left-handed (L)
gold = [1.00, 0.84, 0.35]
grey = [0.62, 0.66, 0.74]
sea = [0.30, 0.48, 0.80]          # the shaded Dirac sea
hole_fill = [0.02, 0.04, 0.08]    # the inside of the ring that marks a hole
title_color = [0.9, 0.95, 1.0, 0.95]
card_title_color = [0.92, 0.96, 1.0]
formula_alpha = 0.95
caption_alpha = 0.95
chapter_label_alpha = 0.9
card_number_alpha = 0.9
panel_cutoff = 0.01

[timeline]
card_s = 1.5
part_bounds = [0.0, 15.0, 40.0, 63.0, 80.0, 97.0]
card_at = [0.0, 0.0, 15.0, 40.0, 63.0, 80.0]
card_fade_in = [0.0, 0.16]
card_fade_out = [0.84, 1.0]
part_fade_in = [0.0, 0.5]         # the content of a part (below the title) fades in after its card
part_fade_top = 0.10              # the top of the frame (the title) does not fade: fraction of the height

[layout]
main_axes = [0.29, 0.14, 0.51, 0.61]
landau_axes = [0.34, 0.14, 0.46, 0.57]
ring_axes = [0.0, 0.36, 0.29, 0.38]
stair_axes = [0.045, 0.135, 0.215, 0.205]
plate_axes = [0.03, 0.22, 0.27, 0.46]
triangle_axes = [0.02, 0.20, 0.42, 0.54]
gamma_axes = [0.47, 0.12, 0.50, 0.30]
title_pos = [0.03, 0.935]
chapter_label_pos = [0.97, 0.938]
