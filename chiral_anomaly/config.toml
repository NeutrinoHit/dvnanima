[main]                            # the dispersion lines and the levels (units: level spacing)
xlim = [-13.0, 13.0]
ylim = [-9.0, 9.0]
fade_energy = [7.0, 8.7]          # the dots fade out between these |E| near the top and the bottom of the view (the sea is infinite)
