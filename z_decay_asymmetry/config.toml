# Every number of the film "Asymmetry in Z-boson production and decay" lives here (the script contains only algorithms).
# Override on the command line:  --config other.toml   or   --set physics.sin2_theta_w=0.25 --set video.crf=18
# Units: "film s" are seconds of the content (the chapter cards are inserted by the timeline); positions marked "fraction" are
# fractions of the width (x) or of the height (y, counted from the TOP of the frame); sizes marked "px" are pixels of the
# 1280 x 720 reference frame (they scale with the frame height); font sizes are points at 720 p; line widths are points at 720 p.

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 22
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.6
reference_height = 720

[physics]
# The numbers of the book (chapter "Weak decays of W and Z bosons"): sin^2(theta_W)(m_Z) = 0.2316, 1/alpha_em(m_Z) = 128.95,
# Gamma_Z = 2495.5 MeV (experiment); m_Z is the PDG value (the book does not print it).
sin2_theta_w = 0.2316
alpha_inv_mz = 128.95
m_z = 91.1876                     # GeV
gamma_z = 2.4955                  # GeV
gev2_to_nb = 3.8938e5             # (hbar c)^2 in nb GeV^2, only for the cross-section scale of the A_FB(sqrt s) background
sin2_theta_w_symmetric = 0.25     # g_v of the charged leptons vanishes here
sin2_theta_w_err = 0.0012         # the error quoted in the book

# t_3 and the electric charge q of the fermion families as [numerator, denominator]; nc = number of colours
[physics.fermions.nu]
t3 = [1, 2]
q = [0, 1]
nc = 1
[physics.fermions.e]
t3 = [-1, 2]
q = [-1, 1]
nc = 1
[physics.fermions.u]
t3 = [1, 2]
q = [2, 3]
nc = 3
[physics.fermions.d]
t3 = [-1, 2]
q = [-1, 3]
nc = 3

[sampling]
seed_b = 1                        # events of the b-quark part (any seed is valid statistically; this one ends within 0.4 sigma of the model)
seed_mu = 2                       # events of the muon part (ends within 0.5 sigma)
seed_test = 7
n_b = 20000                       # b events in the film
n_mu = 1000000                    # muon events in the film

# ------------------------------------------------------------------------------------------------ the timeline
# part 1 couplings, 2 four channels, 3 the weak angle, 4 events, 5 the pole scan; the chapter cards are inserted before the parts 2-5
[timeline]
card_s = [2.4, 1.4, 1.4, 1.4, 1.4]              # the title card, then the cards of the chapters 2..5
card_at = [0.0, 13.0, 39.5, 53.0, 77.0]           # content time before which a card is shown
part_bounds = [0.0, 13.0, 39.5, 53.0, 77.0, 89.0]
card_fade_in = [0.0, 0.18]
card_fade_out = [0.80, 1.0]

# ------------------------------------------------------------------------------------------------ part 1: the couplings
[couplings]
formula_in = [[0.0, 1.0], [1.3, 2.3], [2.6, 3.6], [3.0, 4.0]]   # the formula rows fade in: g_v g_a, g_L, g_R, the current
legend_in = [4.0, 5.0]
group_start = [3.8, 5.1, 6.4, 7.7]                  # the bars of nu, e, u, d grow one after another
group_grow_s = 1.0
readout_delay = 0.8                                 # the number A_LR appears this long after the group starts
caption_at = [0.0, 3.6, 8.9, 11.0]                  # c1a, c1b, c1c, c1d
groups = ["nu", "e", "u", "d"]
value_decimals = 2                                  # the g^2 printed over the bars
a_decimals = 3                                      # the asymmetry A_LR
highlight_at = [11.0, 11.8]                         # the electron group is framed (production and decay of the Z give the same A_LR^e)
highlight_alpha = 0.55
highlight_pad = [18.0, 14.0, 20.0, 12.0]            # px: left, top, right, bottom around the group

[couplings.layout]
group_x = [0.170, 0.395, 0.620, 0.845]              # fraction of the width
baseline_y = 0.715
unit_height = 0.355                                 # fraction of the height of a bar of the squared coupling 1
bar_width = 0.044                                   # fraction of the width
bar_gap = 0.008
name_y = 0.790
charge_y = 0.828
a_y = 0.872
value_dy = -0.020                                   # the printed value above the bar (fraction of the height)
formula_pos = [[0.030, 0.140], [0.030, 0.206], [0.030, 0.272], [0.500, 0.140]]   # g_v g_a / g_L / g_R / the current
legend_pos = [[0.500, 0.225], [0.500, 0.296]]       # the left end of the icons of the legend
legend_icon_scale = 1.15
legend_text_gap = 16.0                              # px: between the pictogram and its text
lr_label_dy = 0.030                                 # the labels g_L^2, g_R^2 under the bars
baseline_alpha = 0.55
baseline_width = 1.1
bar_alpha = 0.9

