# Every number of the film "A camera at a wormhole" lives here (the scripts contain only algorithms).
# Override on the command line:  --config other.toml   or   --set sky.n_galaxies=2000 --set video.fps=24
# Lengths in the wormhole units are in units of the throat radius b (b = 1), angles in degrees unless the key says "rad".

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 22
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.8
reference_height = 720

[physics]
b = 1.0                    # the throat radius (the unit of length)
b_si_m = 1000.0            # the throat radius used for the energy estimate of the book (1 km)
c_si = 299792458.0
g_si = 6.67430e-11
sun_rest_energy_j = 1.8e47 # E_sun = M_sun c^2, the number of the book

[sky]
width = 6144               # equirectangular maps (two orientations of the pole, see wormhole_sky.py), height = width / 2
cache_dir = ".cache"
mip_levels = 9
seed_ours = 11
seed_theirs = 23
pole_margin_deg = 52.0     # an object is drawn into a map when its latitude in that map is below this angle
star_psf_sigma_px = 0.85
star_flux_min = 0.10
star_flux_slope = 1.5
star_flux_max = 2.5
bright_flux_min = 12.0
bright_flux_slope = 1.6
bright_flux_max = 80.0
spike_length_deg = 1.0
spike_weight = 0.05
star_halo_weight = 0.03
spike_width_px = 0.6
exposure = 1.0

[sky.ours]                 # the sky on our side: warm, golden
n_galaxies = 16000
n_stars = 36000
n_bright_stars = 70
size_min_deg = 0.05
size_max_deg = 2.4
size_slope = 1.35           # number of galaxies larger than s ~ s^-slope
spiral_fraction = 0.55
elliptical_fraction = 0.30
star_colors = [[1.0, 0.82, 0.62], [1.0, 0.95, 0.85], [0.78, 0.86, 1.0]]
galaxy_colors = [[1.0, 0.78, 0.50], [1.0, 0.65, 0.40], [0.80, 0.88, 1.0]]
arm_color = [0.62, 0.78, 1.0]
bulge_color = [1.0, 0.80, 0.52]
nebula_colors = [[0.95, 0.38, 0.18], [0.20, 0.62, 0.78]]
nebula_strength = [0.105, 0.075]
nebula_waves = 70
nebula_seed_offset = 5

[sky.theirs]               # the sky on the other side: cold, violet and blue
n_galaxies = 16000
n_stars = 36000
n_bright_stars = 70
size_min_deg = 0.05
size_max_deg = 2.4
size_slope = 1.35
spiral_fraction = 0.50
elliptical_fraction = 0.25
star_colors = [[0.70, 0.80, 1.0], [0.92, 0.95, 1.0], [1.0, 0.85, 0.90]]
galaxy_colors = [[0.55, 0.70, 1.0], [0.75, 0.55, 1.0], [0.60, 0.95, 0.95]]
arm_color = [0.50, 0.90, 1.0]
bulge_color = [0.85, 0.80, 1.0]
nebula_colors = [[0.62, 0.28, 0.95], [0.15, 0.78, 0.70]]
nebula_strength = [0.115, 0.075]
nebula_waves = 70
nebula_seed_offset = 9

[galaxy]
spiral_arms = [2, 3]
spiral_pitch_deg = [14.0, 28.0]
arm_sharpness = 2.2
arm_amplitude = 0.85
disk_scale_over_size = 0.22   # exponential scale length / the angular size
bulge_over_size = 0.05
bulge_weight = 1.6
knots_per_galaxy = 14
knot_weight = 2.4
dust_lane_width = 0.035
surface_brightness = 22.0
brightness_slope = 0.55       # smaller galaxies are fainter: peak ~ size^slope
inclination_deg = [0.0, 88.0]
elliptical_axis_ratio = [0.45, 1.0]

