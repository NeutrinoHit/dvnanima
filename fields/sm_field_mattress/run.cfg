[manim]
profile = widescreen
frame_rate = 30
background_color = #000000

[scene]
show_labels = true
show_legend = true
show_field_tags = false

[stack]
width = 8.8
depth = 5.5
layer_spacing = 0.165
surface_resolution_x = 18
surface_resolution_y = 12
line_samples = 32
vacuum_amplitude = 0.040
vacuum_speed = 1.15
wave_amplitude = 0.072
wave_packet_amplitude = 0.165
wave_packet_sigma = 0.82
wave_packet_speed = 1.12
wave_packet_wavenumber = 3.2
fill_opacity = 0.045
stroke_opacity = 0.78
stroke_width = 0.72
cutout_center_x = -0.90
cutout_center_y = -1.70
cutout_width = 3.15
cutout_depth = 2.25
cutout_edge_samples = 30
cutout_edge_opacity = 0.92
cutout_edge_width = 1.12

[camera]
phi = 65
theta = -48
zoom = 0.96
frame_center_x = -0.12
frame_center_y = -0.16
frame_center_z = 0.02

[timing]
build_time = 2.4
vacuum_time = 6.0
wave_time = 9.0
cutaway_reveal_time = 3.0
cutaway_time = 14.0
hold_time = 4.0

[colors]
text = #FFFFFF
muted = #C9D4E5
accent = #FFD166
panel = #05080C
panel_stroke = #7CC7FF
