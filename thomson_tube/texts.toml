# All the words and formulas of the film (the same keys in both languages); formulas are matplotlib mathtext (LaTeX), words stay outside $...$.

[en]
title = '''Thomson's experiment: the charge-to-mass ratio of cathode rays'''
sub = '''J. J. Thomson, 1897'''
cathode = '''cathode'''
anode = '''anode'''
screen = '''fluorescent screen'''
plates = '''plates ($\mathbf{E}$)'''
coil = '''magnet ($\mathbf{B}$)'''
front = '''the screen, front view'''
cap0 = '''cathode rays: a beam of particles or waves? Without fields the beam hits the centre of the screen'''
capE = '''an electric field bends the beam towards the positive plate: the rays carry a negative charge'''
capB = '''a magnetic field bends it the other way, and the bend depends on the speed'''
capS = '''we tune $B$ until the spot returns to the centre: then the forces cancel and $v=E/B$'''
capBal = '''the balance gives the speed of the particles: $v=E/B$'''
capM = '''now only $E$ is on: the deflection gives $e/m$, about 1800 times that of the hydrogen ion'''
capEnd = '''the particles are far lighter than an atom: the electron was discovered'''
f0 = '''$\frac{1}{2}mv^2=eU$'''
fE = '''$y_E=\frac{e}{m}\,\frac{E\,\ell\,(\ell/2+D)}{v^2}$'''
fB = '''$y_B=-\frac{e}{m}\,\frac{B\,\ell\,(\ell/2+D)}{v}$'''
fBal = '''$eE=evB\;\Rightarrow\;v=\frac{E}{B}$'''
fM = '''$\frac{e}{m}=\frac{y_E\,E}{B^2\,\ell\,(\ell/2+D)}$'''
meas = '''measured'''
units = '''arbitrary units: $e/m=1$'''
res = '''Thomson: $e/m\sim 10^{11}$ C/kg
modern: $1.7588\times10^{11}$ C/kg'''
yspot = '''spot'''
gold = '''E'''

