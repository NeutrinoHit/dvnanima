# Every number of the film "Chiral waves and the fermion mass" lives here (the script contains only algorithms).
# Override on the command line:  --config other.toml   or   --set style.background='"#000000"' --set stage.view_half=10
# Units: the physics is in the units hbar = c = 1 with arbitrary length and mass units ("toy units", the film says so);
# "film s" are seconds of the content (the cards are inserted by the timeline); "phys" is the physical time of the equation.
# Figure fractions are fractions of the width / height of the frame, font sizes are points at 720 p (they scale with the height).

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 24
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.6
reference_height = 720

[grid]                            # the periodic grid of the exact Fourier solution
length = 64.0
n = 1024
dt = 0.004                        # the largest step of the integration of a time dependent mass (phys)
sample_rate = 30                  # frames of the stored simulations per film second (the film is drawn from them)

[higgs]                           # m = f v / sqrt(2)  (the book, the Standard Model chapter, the section "Fermion masses")
v = 4.242640687119285             # the condensate in toy units, so that f = 1 gives m = 3
f_ref = 1.0
v_max = 4.242640687119285         # the end of the dial of v
f_max = 2.0                       # the end of the dial of f

[packet]
sigma = 1.6                       # standard deviation of |psi|^2 of a moving packet
carrier_p = 3.0
start_x = -5.5
rest_sigma = 3.0                  # a packet at rest is wider (the momentum spread is smaller, so that the flips stay close to cos(2 m t))
rest_phase_deg = 45.0             # the global phase of the pure-chirality packet at rest (both Re psi_R and Re psi_L are then non-zero)

[timeline]
card_s = 1.6
part_bounds = [0.0, 13.0, 30.0, 48.0, 66.0, 80.0]
card_at = [0.0, 0.0, 13.0, 30.0, 48.0, 66.0]
card_fade_in = [0.0, 0.16]
card_fade_out = [0.84, 1.0]
part_fade_in = [0.0, 0.5]         # the content of a part (below the title) fades in after its card
part_fade_top = 0.10              # the top of the frame (the title) does not fade: fraction of the height

# ----------------------------------------------------------------------------------------------- the parts

[part1]                           # m = 0: two independent waves
rate = 1.2                        # phys time per film second
r_start = -7.0
l_start = 7.0
captions = [[0.0, "c1a"], [6.0, "c1b"]]
formulas = [
  { key = "f1a", color = "warm", x = 0.03, row = 0, appear = [0.3, 1.3] },
  { key = "f1b", color = "cold", x = 0.03, row = 1, appear = [1.3, 2.3] },
]

[part2]                           # the condensate switches on
segments = [[0.0, 3.0, 1.0], [3.0, 5.0, 0.15], [5.0, 100.0, 0.8]]    # film s from, to, phys time per film second (slow motion in the ramp)
ramp_start = 3.0                  # phys
ramp_duration = 0.3               # phys; slow motion makes it 2 film s: the dial is seen turning
f = 1.0
window = 6.0                      # the chirality plot shows the last ... phys time units
window_lead = 0.5                 # the pen is this far from the right edge of the plot
captions = [[0.0, "c2a"], [3.0, "c2b"], [5.0, "c2c"], [9.0, "c2d"]]
formulas = [
  { key = "f2a", color = "warm", x = 0.03, row = 0, appear = [0.3, 1.2] },
  { key = "f2b", color = "cold", x = 0.03, row = 1, appear = [0.3, 1.2] },
]
slow_label = [3.0, 5.0]           # film s from, to: the "slow motion" tag
mean_from = 6.5                   # film s: the dashed line of the mean chirality appears
freq_from = 6.5                   # film s: the label of the oscillation frequency 2E appears
centroid_from = 3.5               # film s: the centroid marker appears
branch_from = 9.0                 # film s: the labels E > 0 and E < 0 of the two parts of the wave appear

[part3]                           # a pure psi_R wave at rest, three Yukawa constants
rate = 1.0
runs = [
  { f = 0.5, from = 0.0, to = 6.0 },
  { f = 1.0, from = 6.0, to = 12.0 },
  { f = 2.0, from = 12.0, to = 18.0 },
]
fade_s = 0.5
dial_turn_s = 0.8                 # the dial moves to the next f during the last ... s of a run
captions = [[0.0, "c3a"], [6.0, "c3b"], [12.0, "c3c"]]
formulas = [
  { key = "f3a", color = "text", x = 0.03, row = 0, appear = [0.3, 1.2] },
  { key = "f3b", color = "text", x = 0.03, row = 1, appear = [0.3, 1.2] },
]

[part4]                           # eigenstate packets: both chiralities travel together
rate = 1.0
f_values = [0.0, 1.0, 2.0]
lead_s = 2.0                      # film s before the packets start to move
captions = [[0.0, "c4a"], [6.0, "c4b"], [12.0, "c4c"]]
formulas = [
  { key = "f4a", color = "text", x = 0.03, row = 0, appear = [0.3, 1.2] },
  { key = "f4b", color = "text", x = 0.03, row = 1, appear = [2.0, 3.0] },
]
readout_from = 2.5

[part5]                           # why the spring exists: the Yukawa term
f = 1.0
rate = 1.0
relabel = [4.0, 5.0]              # film s: the lane labels turn into the electron doublet and singlet
rows = [
  { key = "f5a", from = 0.4, y = 0.282 },
  { key = "f5b", from = 3.6, y = 0.220 },
  { key = "f5c", from = 7.2, y = 0.158 },
  { key = "f5d", from = 10.4, y = 0.098 },
]
row_fade_s = 0.8
captions = [[0.0, "c5a"]]

