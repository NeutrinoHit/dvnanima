[en]
title = '''Chiral waves and the fermion mass'''
h0 = '''Chiral waves and the fermion mass'''
h0s = '''the mass couples the left and the right chiral waves'''
h1 = '''Without mass: two independent waves'''
h1s = '''$\psi_R$ runs to the right, $\psi_L$ to the left'''
h2 = '''The condensate switches on'''
h2s = '''the mass $m=fv/\sqrt{2}$ couples $\psi_R$ and $\psi_L$'''
h3 = '''Chirality flips with the frequency $2E$'''
h3s = '''a pure $\psi_R$ wave at rest: the heavier, the faster'''
h4 = '''A massive particle: two waves locked together'''
h4s = '''both chiralities travel in step, $v=p/E<c$'''
h5 = '''Why the spring exists'''
h5s = '''the mass term is forbidden, the Yukawa term gives it'''
c1a = '''no mass: the Dirac equation splits into two independent waves, $\psi_R$ runs to the right and $\psi_L$ to the left, both at the speed of light'''
c1b = '''in 1+1 dimensions chirality is the direction of motion: the waves cross and do not notice each other, each chirality is conserved'''
c2a = '''the condensate is off, $v=0$ (as in the hot early Universe): $\psi_R$ runs at the speed of light, $\psi_L$ is empty'''
c2b = '''slow motion: we switch the condensate $v$ on, $m=fv/\sqrt{2}$; the springs symbolise the coupling of the two waves'''
c2c = '''$\psi_R$ is a source of $\psi_L$ and back: the chirality $\langle\gamma_5\rangle$ oscillates with the frequency $2E=2\sqrt{p^2+m^2}$'''
c2d = '''the oscillation dies out as the packet splits: the main part ($E>0$) slows down, $v=p/E<c$, a small part ($E<0$) runs backwards'''
c3a = '''a pure $\psi_R$ wave at rest: the condensate turns it into $\psi_L$ and back, like the energy of two coupled pendulums'''
c3b = '''twice the Yukawa constant $f$, twice the mass, twice as fast flips: $\langle\gamma_5\rangle=\cos 2mt$'''
c3c = '''the flip frequency $2m$ is the gap between the branches $E=\pm m$ at $p=0$'''
c4a = '''now the packet is built from the eigenstates of $H$: $\psi_L$ and $\psi_R$ are locked together, $\psi_L/\psi_R=m/(E+p)$'''
c4b = '''no flips: $\langle\gamma_5\rangle=p/E$ stays constant; in 1+1 dimensions $\gamma_5$ is the velocity operator, $\langle\gamma_5\rangle=v$'''
c4c = '''the heavier the fermion, the more $\psi_L$ it carries and the slower it runs: $v=\partial E/\partial p=p/E$'''
c5a = '''a massive fermion needs both chiralities: the mass is the coupling of $\psi_L$ and $\psi_R$ through the condensate'''
f1a = '''$i(\partial_t+\partial_x)\,\psi_R=0\ \Rightarrow\ \psi_R=\psi_R(x-t)$'''
f1b = '''$i(\partial_t-\partial_x)\,\psi_L=0\ \Rightarrow\ \psi_L=\psi_L(x+t)$'''
f2a = '''$i(\partial_t+\partial_x)\,\psi_R=m\,\psi_L$'''
f2b = '''$i(\partial_t-\partial_x)\,\psi_L=m\,\psi_R$'''
f3a = '''$\langle\gamma_5\rangle=P_R-P_L=\cos 2mt$'''
f3b = '''$P_R=\cos^2 mt,\qquad P_L=\sin^2 mt$'''
f4a = '''$v=\partial E/\partial p=p/E$'''
f4b = '''$\psi_L/\psi_R=m/(E+p),\quad \langle\gamma_5\rangle=p/E$'''
f5a = '''the mass term couples the chiral waves: $-m\,(\bar{\psi}_L\psi_R+\bar{\psi}_R\psi_L)$'''
f5b = '''but $L=(\nu_L,e_L)$ is an $SU(2)$ doublet and $e_R$ is a singlet: this term is not gauge invariant'''
f5c = '''the Yukawa term with the Higgs doublet $\phi$ is allowed: $-f\,\bar{L}\,e_R\,\phi\ +$ h.c.'''
f5d = '''the condensate $\langle\phi\rangle=(0,\,v/\sqrt{2})$ turns it into the missing mass term: $m=fv/\sqrt{2}$'''
note = '''exact solution of the (1+1)-dimensional Dirac equation, $\hbar=c=1$, arbitrary units'''
