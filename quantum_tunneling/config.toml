lim_head_gap = 0.05
lim_head_pre = 0.03
lim_par_gap = 0.022
c1_junction_axes = [0.04, 0.22, 0.46, 0.46]
c1_well_axes = [0.56, 0.12, 0.40, 0.62]
c2_pot_axes = [0.07, 0.45, 0.58, 0.29]
c2_den_axes = [0.07, 0.17, 0.58, 0.20]
c2_rate_axes = [0.73, 0.17, 0.24, 0.27]
c2_text_x = 0.68
