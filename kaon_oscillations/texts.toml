c3a = '''thin targets along the beam: $\overline{K}^0N\to\Lambda\pi$ is allowed by strangeness, $K^0N\to\Lambda\pi$ is not'''
c3b = '''a thin target gives a number of $\Lambda$ proportional to $P_{K^0\to\overline{K}^0}$ at its position: the oscillation shows up in the hyperon yield along the beam'''
c3c = '''the yield passes a maximum and then follows the slowly decaying $K_L$ beam, which is half $\overline{K}^0$'''
