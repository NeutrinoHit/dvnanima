f2b1 = '''$|K^0(t)\rangle=\frac{1}{\sqrt{2}}\left(e^{-im_St-\Gamma_St/2}|K_S\rangle+e^{-im_Lt-\Gamma_Lt/2}|K_L\rangle\right)$'''
f2b2 = '''$P_{K^0\to K^0}=\frac{1}{4}\left(e^{-\Gamma_St}+e^{-\Gamma_Lt}+2e^{-(\Gamma_S+\Gamma_L)t/2}\cos\Delta m\,t\right)$'''
f2b3 = '''$P_{K^0\to\overline{K}^0}=\frac{1}{4}\left(e^{-\Gamma_St}+e^{-\Gamma_Lt}-2e^{-(\Gamma_S+\Gamma_L)t/2}\cos\Delta m\,t\right)$'''
f2c1 = '''$t\gg\tau_S:\qquad P_{K^0\to K^0}\simeq P_{K^0\to\overline{K}^0}\simeq\frac{1}{4}e^{-\Gamma_Lt}$'''
f2c2 = '''$|K^0(t)\rangle\to\frac{1}{\sqrt{2}}e^{-im_Lt-\Gamma_Lt/2}|K_L\rangle=\frac{1}{2}e^{-im_Lt-\Gamma_Lt/2}\left(|K^0\rangle+|\overline{K}^0\rangle\right)$'''
c2a = '''kaons without decays: two arrows (the $K_S$ and $K_L$ parts) rotate with different phases; $K^0$ is their sum, $\overline{K}^0$ their difference'''
c2b = '''the oscillation is complete: $K^0\to\overline{K}^0\to K^0$ with the period $2\pi/\Delta m=@period@\,\tau_S$ (the phase of the mean mass is removed)'''
c2c = '''with the true widths the arrows shrink ($K_S$ fast): $K^0\to\overline{K}^0$ only partly, $\Delta m\,\tau_S=@dmtau@$; the sum falls as $(e^{-\Gamma_St}+e^{-\Gamma_Lt})/2$'''
c2d = '''the time axis is now in units of $\tau_L=@ratio@\,\tau_S$: the whole oscillation is squeezed against the vertical axis'''
c2e = '''$K_S$ is gone and a pure $K_L$ beam is left: half $K^0$ and half $\overline{K}^0$ (the two arrows are equal)'''
