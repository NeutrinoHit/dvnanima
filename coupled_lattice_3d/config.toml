# Every number of the film "A 3D lattice of coupled oscillators" lives here (the scripts contain only algorithms).
# Override on the command line:  --config other.toml   or   --set camera.elevation_deg=30 --set style.dot_gain=0.5
# Units: "film s" are seconds of the content (the chapter cards are inserted by the timeline), "sites" are the lattice spacings,
# figure fractions are fractions of the width / height of the frame, font sizes are points at 720 p (they scale with the height).

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 24
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.6                      # fade from / to black at the ends of the film
reference_height = 720            # the height at which the sizes below are meant

[physics]                         # the lattice (see lattice3d_physics.py)
nx = 14
ny = 8
nz = 8
k = 1.0                           # spring constant (the mass is 1)
alpha = 0.45                      # anharmonic bond potential V(d) = k d^2/2 + alpha d^3/3 + beta d^4/4 ; alpha^2 < 3 beta k
beta = 0.09
integrator_dt = 0.025             # velocity Verlet step of the film (the tests use a finer one)
default_dt = 0.02                 # the default step of P.integrate
wave_rate = 1.0                   # physical time per film second in the wave chapters
nonlinear_samples_per_s = 30      # the stored states of the anharmonic run per film second (= fps)

[physics.packet]                  # the two wave packets of the collision (along x, centred in y and z)
amplitude = 1.10
carrier_k = 1.3
sigma_x = 1.8
sigma_yz = 2.2
left_x = 4.0
right_x = 11.0

[physics.bump]                    # the bump of the spherical wave: centre (sites), sigmas (sites), amplitude
centre = [5.0, 4.5, 4.5]
sigma = [1.2, 1.2, 1.2]
amplitude = 2.2

[timeline]
card_s = 1.6                      # length of a chapter card
part_bounds = [0.0, 11.5, 41.5, 57.5, 75.5, 95.5, 107.5]   # content times: intro | modes | bump | linear | anharmonic | limit | end
card_at = [0.0, 0.0, 11.5, 41.5, 57.5, 75.5, 95.5]         # a card is shown before these content times (the first one is the film title)
card_fade_in = [0.0, 0.16]        # fractions of a card
card_fade_out = [0.84, 1.0]

[intro]
lattice_appear = [0.3, 2.6]
formula1_in = [2.4, 3.4]
formula1_out = [6.0, 6.8]
formula2_in = [6.8, 7.8]
caption_switch = 6.5
sweep_lead = 8.0                  # the masses appear layer by layer along x: (progress * (nx + lead) - x) / width
sweep_width = 6.0

[modes]
period_s = 8.0                    # film seconds per period of the mode (1, 1, 1)
amplitude = 15.0
fade_s = 0.8                      # a mode fades in and out
panels_fade_s = 1.5               # the spectrum and the dispersion fade in
reference_displacement = 0.55     # the displacement of a full-size dot (qref)
list = [                          # a, b, c (0 = the highest index, a checkerboard), from, to, caption key
  { a = 1, b = 1, c = 1, from = 11.5, to = 20.5, caption = "cm" },
  { a = 2, b = 1, c = 1, from = 20.5, to = 26.5, caption = "cm" },
  { a = 2, b = 2, c = 1, from = 26.5, to = 32.0, caption = "cm_hi" },
  { a = 5, b = 3, c = 2, from = 32.0, to = 37.0, caption = "cm_hi" },
  { a = 0, b = 0, c = 0, from = 37.0, to = 41.5, caption = "cm_last" },
]

[pluck]
caption_switch = 9.0              # seconds after the start of the chapter

[nonlinear]
caption_switch = 10.0

[limit]
levels = [[14, 8, 8], [28, 16, 16], [56, 32, 32]]     # the refinement of the lattice
level_s = 2.6
time_rate = 0.9                   # physical time per film second
time_offset = 0.5
formula_in = [6.0, 7.5]
caption_switch = 6.5
label_switch = [6.0, 7.0]         # "N = ..." becomes "N -> infinity"
dispersion_switch = [5.0, 7.0]    # the continuum line appears in the dispersion panel
fine_grid = [59, 35, 35]          # the grid of the exact continuum solution (spacing 1/4 of a site)
reference_displacement = 0.35
reference_n = 14                  # the lattice whose dots have the nominal size
dot_size_exponent = 1.8           # the dot area of a finer lattice is  dot_size * (reference_n / n) ** exponent
dot_alpha_exponent = 0.2          # and its opacity is  (reference_n / n) ** exponent
lines_max_n = 14                  # springs are drawn up to this lattice
label_threshold = 0.5            # the label changes from N = ... to N -> infinity at this progress

[spectrum]
bins = 28
ymax_margin = 1.15
ymax_stride = 15                  # every n-th stored state of the anharmonic run is used for the scale
bar_width = 0.82
bar_alpha = 0.85
active_alpha = 0.95
baseline_alpha = 0.5
baseline_width = 1.0
title_pos = [0.0, 1.05]
xlabel_pos = [1.0, -0.05]
title_size = 11.5
xlabel_size = 12
delta_pos = [0.70, 0.835]
delta_size = 10.5
delta_linespacing = 1.2

[dispersion]
k_margin = 1.05
y_max = 3.7
line_samples = 50
dot_size_base = 3.0
dot_size_gain = 55.0
dot_alpha_base = 0.25
dot_alpha_gain = 0.75
active_size = 80.0
cone_alpha = 0.20
cone_width = 1.0
cone_dash = [3, 3]
limit_dot_size = 6.0
limit_dot_alpha = 0.6
limit_dot_fade = 0.6
limit_line_width = 2.0
limit_line_dash = [4, 3]
limit_label_pos = [0.1, 3.2]
limit_label_size = 11
lattice_label_offset = [-0.1, 0.15]
baseline_alpha = 0.5
baseline_width = 1.0
title_pos = [0.0, 1.05]
xlabel_pos = [1.0, -0.05]
title_size = 11.5
xlabel_size = 12

[camera]
azimuth_deg = 35.0
elevation_deg = 22.0
xlim = [-10.7, 10.7]
ylim = [-7.2, 7.2]

[layout]                          # figure fractions: [left, bottom, width, height]
lattice_axes = [0.02, 0.09, 0.62, 0.74]
spectrum_axes = [0.70, 0.50, 0.26, 0.27]
dispersion_axes = [0.70, 0.115, 0.26, 0.26]
title_pos = [0.03, 0.935]
chapter_label_pos = [0.97, 0.938]
formula_pos = [0.03, 0.855]
formula_row = 0.07
formula_min_alpha = 0.01
caption_pos = [0.03, 0.035]
mode_label_pos = [0.70, 0.865]
tag_pos = [0.03, 0.80]
n_label_pos = [0.64, 0.805]
card_title_y = 0.52
card_subtitle_y = 0.43
card_number_y = 0.62
card_chapter_y = 0.50
card_chapter_sub_y = 0.41

[fonts]
title = 19
chapter_label = 13
formula = 15
caption = 11.5
mode_label = 13
tag = 13
n_label = 15
card_title = 36
card_subtitle = 17
card_number = 54
card_chapter = 32
card_chapter_sub = 16

[style]
background = "#03060c"
text = [0.88, 0.93, 1.0]
dim = [0.60, 0.68, 0.80]
blue = [0.40, 0.72, 1.00]
warm = [1.00, 0.55, 0.40]
gold = [1.00, 0.84, 0.35]
mid = [0.85, 0.88, 0.95]
title_color = [0.9, 0.95, 1.0, 0.95]
card_title_color = [0.92, 0.96, 1.0]
formula_alpha = 0.95
caption_alpha = 0.95
chapter_label_alpha = 0.9
card_number_alpha = 0.9
cube_color = [0.7, 0.75, 0.85]
cube_alpha = 0.75
cube_width = 1.8
spring_color = [0.72, 0.78, 0.88]
spring_alpha = 0.10
spring_width = 0.7
dot_size = 26.0                   # the area of a dot (pt^2 at 720 p) is  dot_size * (dot_base + dot_gain * |q| / qref)
dot_base = 0.12
dot_gain = 0.62
dot_alpha_base = 0.30
dot_alpha_gain = 0.70
dot_shift = 0.30                  # a dot is shifted along z by  dot_shift * q / qref  (clipped)
dot_shift_clip = 1.5
panel_cutoff = 0.01                # the spectrum and the dispersion are drawn when their opacity exceeds this
lattice_cutoff = 0.001              # the lattice is drawn when its progress exceeds this
