# All the words and formulas of the film (the same keys in both languages); formulas are matplotlib mathtext (LaTeX), words stay outside $...$.

[en]
title = '''A 3D lattice of coupled oscillators'''
h0 = '''A 3D lattice of coupled oscillators'''
h0s = '''from the normal modes to the field'''
h1 = '''The lattice and its equations'''
h1s = '''masses and springs in space'''
h2 = '''Normal modes'''
h2s = '''every mass oscillates with the same frequency'''
h3 = '''A released bump: a spherical wave'''
h3s = '''many modes at once'''
h4 = '''The linear lattice: free waves'''
h4s = '''waves pass through each other'''
h5 = '''Nonlinear interactions'''
h5s = '''anharmonic terms in the Lagrangian'''
h6 = '''The limit $N\to\infty$: the field'''
h6s = '''the lattice becomes a continuous field'''
c0 = '''a box of masses joined by springs: the mattress of fields in three dimensions'''
c1 = '''the equation of motion of every mass: the force of its six neighbours'''
cm = '''normal mode: every mass oscillates with the same frequency'''
cm_hi = '''the higher the mode, the shorter the wave and the higher the frequency'''
cm_last = '''the shortest wave: neighbours move in opposite directions'''
cp = '''a bump is released at the centre: a spherical wave runs to the walls, many modes take part'''
cp2 = '''the energy of every mode is constant: the modes do not interact'''
cl = '''two waves meet and pass through each other: free particles'''
cn = '''add anharmonic terms (cubic and quartic) to the Lagrangian: the modes begin to exchange energy'''
cn2 = '''the energy is redistributed among the normal modes: this is the interaction'''
cc = '''N grows, the springs get shorter: the lattice becomes a continuous field'''
cc2 = '''the indices i, j, k become the coordinates x, y, z, the displacement becomes the field'''
l_cont = '''field: $\omega=c|\mathbf{k}|$'''
l_latt = '''lattice'''
delta = "energy moved\nto other modes:"
E = '''spectrum of the mode energies'''
disp = '''frequency $\omega_{abc}$'''
mode = '''mode'''
lin = '''linear lattice'''
nonlin = '''with anharmonic terms'''
fL1 = '''$L=\sum_{i,j,k}\frac{1}{2}m\dot{q}_{ijk}^2-\sum_{\mathrm{bonds}}\frac{k}{2}\,(q-q')^2$'''
fEq = '''$m\ddot{q}_{ijk}=k\left(\sum_{6\ \mathrm{neighbours}}q_{\mathrm{n}}-6\,q_{ijk}\right)$'''
fM1 = '''$q_{ijk}^{(a,b,c)}=A\,\sin\frac{a\pi i}{N_x+1}\,\sin\frac{b\pi j}{N_y+1}\,\sin\frac{c\pi k}{N_z+1}\,\cos\omega_{abc}t$'''
fM2 = '''$\omega_{abc}^2=\frac{4k}{m}\left[\sin^2\frac{a\pi}{2(N_x+1)}+\sin^2\frac{b\pi}{2(N_y+1)}+\sin^2\frac{c\pi}{2(N_z+1)}\right]$'''
fP = '''$q_{ijk}(0)=g(\mathbf{r}-\mathbf{r}_0),\quad \dot{q}_{ijk}=0\ \Rightarrow\ q=\sum_{a,b,c}c_{abc}\,y_{abc}(t)$'''
fN = '''$L=\sum\frac{1}{2}m\dot{q}^2-\sum_{\mathrm{bonds}}\left[\frac{k}{2}d^2+\frac{\alpha}{3}d^3+\frac{\beta}{4}d^4\right],\quad d=q-q'$'''
fC = '''$\partial_t^2\varphi=c^2\,\nabla^2\varphi,\qquad \omega=c\,|\mathbf{k}|$'''

