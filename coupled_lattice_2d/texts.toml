h6s = '''the lattice becomes a continuous field'''
c0 = '''a lattice of masses joined by springs: the mattress of fields'''
c1 = '''the equation of motion of every mass: the force of its four neighbours'''
cm = '''normal mode: every mass oscillates with the same frequency'''
cm_hi = '''the higher the mode, the shorter the wave and the higher the frequency'''
cm_last = '''the shortest wave: neighbours move in opposite directions'''
cp = '''a bump is released: circular waves run to the edge, many modes take part'''
cp2 = '''the energy of every mode is constant: the modes do not interact'''
cl = '''two waves meet and pass through each other: free particles'''
cn = '''add anharmonic terms (cubic and quartic) to the Lagrangian: the modes begin to exchange energy'''
cn2 = '''the energy is redistributed among the normal modes: this is the interaction'''
cc = '''N grows, the springs get shorter: the lattice becomes a continuous field'''
cc2 = '''the indices i, j become the coordinates x, y, the displacement becomes the field'''
l_cont = '''field: $\omega=c|\mathbf{k}|$'''
l_latt = '''lattice'''
delta = "energy moved\nto other modes:"
E = '''mode energies $E_{ab}$'''
disp = '''frequency $\omega_{ab}$'''
mode = '''mode'''
lin = '''linear lattice'''
nonlin = '''with anharmonic terms'''
fL1 = '''$L=\sum_{i,j}\frac{1}{2}m\dot{q}_{ij}^2-\sum_{\mathrm{bonds}}\frac{k}{2}\,(q-q')^2$'''
fEq = '''$m\ddot{q}_{ij}=k\,(q_{i+1,j}+q_{i-1,j}+q_{i,j+1}+q_{i,j-1}-4q_{ij})$'''
fM1 = '''$q_{ij}^{(a,b)}=A\,\sin\frac{a\pi i}{N_x+1}\,\sin\frac{b\pi j}{N_y+1}\,\cos\omega_{ab}t$'''
fM2 = '''$\omega_{ab}^2=\frac{4k}{m}\left[\sin^2\frac{a\pi}{2(N_x+1)}+\sin^2\frac{b\pi}{2(N_y+1)}\right]$'''
fP = '''$q_{ij}(0)=g(i-i_0,\,j-j_0),\quad \dot{q}_{ij}=0\ \Rightarrow\ q=\sum_{a,b}c_{ab}\,y_{ab}(t)$'''
fN = '''$L=\sum\frac{1}{2}m\dot{q}^2-\sum_{\mathrm{bonds}}\left[\frac{k}{2}d^2+\frac{\alpha}{3}d^3+\frac{\beta}{4}d^4\right],\quad d=q-q'$'''
fC = '''$\partial_t^2\varphi=c^2\left(\partial_x^2+\partial_y^2\right)\varphi,\qquad \omega=c\,|\mathbf{k}|$'''

