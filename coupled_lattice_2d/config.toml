# Every number of the film "A 2D lattice of coupled oscillators" lives here (the scripts contain only algorithms).
# Override on the command line:  --config other.toml   or   --set camera.elevation_deg=35 --set grid.dot_size=20
# Units: "film s" are seconds of the content (the chapter cards are inserted by the timeline), "sites" are the lattice spacings,
# figure fractions are fractions of the width / height of the frame, font sizes are points at 720 p (they scale with the height).

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 24
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.6
reference_height = 720

[physics]
nx = 14
ny = 10
k = 1.0
alpha = 0.45                      # anharmonic bond potential V(d) = k d^2/2 + alpha d^3/3 + beta d^4/4 ; alpha^2 < 3 beta k
beta = 0.09
integrator_dt = 0.02
default_dt = 0.01
wave_rate = 1.0
nonlinear_samples_per_s = 30

[physics.packet]
amplitude = 0.70
carrier_k = 1.3
sigma_x = 1.8
sigma_y = 3.0
left_x = 4.0
right_x = 11.0

[physics.bump]
centre = [5.0, 5.5]
sigma = [1.3, 1.3]
amplitude = 2.0

[timeline]
card_s = 2.0
part_bounds = [0.0, 16.0, 46.0, 62.0, 80.0, 100.0, 112.0]
card_at = [0.0, 0.0, 16.0, 46.0, 62.0, 80.0, 100.0]
card_fade_in = [0.0, 0.16]
card_fade_out = [0.84, 1.0]

[intro]
lattice_appear = [0.4, 4.0]
formula1_in = [4.5, 6.0]
formula1_out = [9.5, 10.5]
formula2_in = [10.5, 12.0]
caption_switch = 10.0
sweep_lead = 10.0                 # the masses appear along the diagonal: (progress * (nx + ny + lead) - (i + j)) / width
sweep_width = 8.0

[modes]
period_s = 8.0
amplitude = 11.0
fade_s = 0.8
panels_fade_s = 1.5
list = [                          # a, b (0 = the highest index), from, to, caption key
  { a = 1, b = 1, from = 16.0, to = 25.0, caption = "cm" },
  { a = 2, b = 1, from = 25.0, to = 31.0, caption = "cm" },
  { a = 3, b = 2, from = 31.0, to = 36.5, caption = "cm_hi" },
  { a = 6, b = 5, from = 36.5, to = 41.5, caption = "cm_hi" },
  { a = 0, b = 0, from = 41.5, to = 46.0, caption = "cm_last" },
]

[pluck]
caption_switch = 9.0

[collision]
height_scale = 1.8                # the vertical scale of the waves of the linear and the anharmonic collision

[nonlinear]
caption_switch = 10.0

[limit]
levels = [[14, 10], [28, 20], [56, 40], [119, 87]]
level_s = 1.8
time_rate = 0.9
time_offset = 0.5
formula_in = [6.0, 7.5]
caption_switch = 7.0
label_switch = [5.5, 7.0]
dispersion_switch = [5.0, 7.0]
fine_grid = [119, 87]             # the grid of the exact continuum solution (spacing 1/8 of a site)
height_scale = 1.0
springs_max_n = 14                # lattices up to this size are drawn with springs, up to mesh_max_n as a mesh, finer ones as a surface
mesh_max_n = 56
surface_stride = 2                # the surface is drawn on every second point of the fine grid
surface_color_scale = 0.6
label_threshold = 0.5            # the label changes from N = ... to N -> infinity at this progress
surface_cutoff = 0.01              # the continuous surface is drawn when its opacity exceeds this

[map]                             # the map of the mode energies
colormap = [[0.03, 0.05, 0.10], [0.12, 0.30, 0.62], [0.40, 0.72, 1.0], [0.95, 0.98, 1.0]]
border_alpha = 0.25
highlight_width = 2.2
title_pos = [0.0, 1.05]
a_label_pos = [1.0, -0.05]
b_label_pos = [-0.04, 1.0]
title_size = 11.5
label_size = 12
delta_pos = [0.70, 0.835]
delta_size = 10.5
delta_linespacing = 1.2
ymax_stride = 15

[dispersion]
k_max = 4.3
y_max = 3.1
line_samples = 50
dot_size_base = 6.0
dot_size_gain = 70.0
dot_alpha_base = 0.30
dot_alpha_gain = 0.70
active_size = 80.0
cone_alpha = 0.20
cone_width = 1.0
cone_dash = [3, 3]
limit_dot_size = 9.0
limit_dot_alpha = 0.6
limit_dot_fade = 0.6
limit_line_width = 2.0
limit_line_dash = [4, 3]
limit_label_pos = [0.1, 2.6]
limit_label_size = 11
lattice_label_pos = [4.2, 0.15]
baseline_alpha = 0.5
baseline_width = 1.0
title_pos = [0.0, 1.05]
xlabel_pos = [1.0, -0.05]
title_size = 11.5
xlabel_size = 12

[camera]
azimuth_deg = 30.0
elevation_deg = 28.0
xlim = [-9.8, 9.8]
ylim = [-5.6, 6.1]

[grid]                            # the drawing of the lattice
spring_turns = 3
spring_amplitude_px = 3.2         # pixels at 720 p (they scale with the height)
spring_lead_px = 5.0
spring_points = 30
spring_ramp = 0.08                # fraction of a spring over which the coil radius grows from zero
spring_alpha = 0.60
spring_width = 0.9
spring_color = [0.72, 0.78, 0.88]
mesh_color = [0.72, 0.78, 0.88]
mesh_alpha = 0.45
mesh_width = 0.8
mesh_steps = [20, 14]             # the mesh draws every (n - 2) // steps-th line
surface_alpha = 0.85
under_surface_alpha = 0.22        # the translucent sheet under the springs
surface_edge_width = 0.3
light = [-0.45, -0.55, 0.70]
light_norm = 0.84
shade_base = 0.45
shade_gain = 0.65
height_color_scale = 0.8          # the colour saturates at this fraction of the height scale
dot_size = 34.0                   # pt^2 at 720 p for springs; the mesh uses mesh_dot_size (n < dense_n) or dense_dot_size
mesh_dot_size = 10.0
dense_dot_size = 3.0
dense_n = 40
edge_color = [0.7, 0.75, 0.85]
edge_alpha = 0.85
edge_width = 2.2
spring_lead_max = 0.3             # the straight ends of a spring are at most this fraction of its length

[layout]
lattice_axes = [0.02, 0.09, 0.62, 0.74]
map_axes = [0.70, 0.50, 0.26, 0.27]
dispersion_axes = [0.70, 0.115, 0.26, 0.26]
title_pos = [0.03, 0.935]
chapter_label_pos = [0.97, 0.938]
formula_pos = [0.03, 0.855]
formula_row = 0.07
formula_min_alpha = 0.01
caption_pos = [0.03, 0.035]
mode_label_pos = [0.70, 0.865]
tag_pos = [0.03, 0.80]
n_label_pos = [0.64, 0.805]
card_title_y = 0.52
card_subtitle_y = 0.43
card_number_y = 0.62
card_chapter_y = 0.50
card_chapter_sub_y = 0.41

[fonts]
title = 19
chapter_label = 13
formula = 16
caption = 11.5
mode_label = 14
tag = 13
n_label = 15
card_title = 36
card_subtitle = 17
card_number = 54
card_chapter = 32
card_chapter_sub = 16

[style]
background = "#03060c"
text = [0.88, 0.93, 1.0]
dim = [0.60, 0.68, 0.80]
blue = [0.40, 0.72, 1.00]
warm = [1.00, 0.55, 0.40]
gold = [1.00, 0.84, 0.35]
mid = [0.85, 0.88, 0.95]
title_color = [0.9, 0.95, 1.0, 0.95]
card_title_color = [0.92, 0.96, 1.0]
formula_alpha = 0.95
caption_alpha = 0.95
chapter_label_alpha = 0.9
card_number_alpha = 0.9
panel_cutoff = 0.01                # the map and the dispersion are drawn when their opacity exceeds this
lattice_cutoff = 0.001              # the lattice is drawn when its progress exceeds this
