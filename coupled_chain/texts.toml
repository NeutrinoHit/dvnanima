# All the words and formulas of the film (the same keys in both languages); formulas are matplotlib mathtext (LaTeX), words stay outside $...$.

[en]
title = '''A chain of coupled oscillators'''
h0 = '''A chain of coupled oscillators'''
h0s = '''from the normal modes to the field'''
h1 = '''The chain and its equations'''
h1s = '''N masses, N springs, one matrix equation'''
h2 = '''Normal modes'''
h2s = '''every mass oscillates with the same frequency'''
h3 = '''A released bump becomes a wave'''
h3s = '''many modes at once'''
h4 = '''The linear chain: free waves'''
h4s = '''waves pass through each other'''
h5 = '''Nonlinear interactions'''
h5s = '''anharmonic terms in the Lagrangian'''
h6 = '''The limit $N\to\infty$: the field'''
h6s = '''the chain becomes a continuous field'''
c0 = '''N masses joined by springs: the simplest system with many degrees of freedom'''
c1 = '''the equations of motion of all the masses form one matrix equation'''
cm = '''normal mode: every mass oscillates with the same frequency'''
cm_hi = '''the higher the mode, the shorter the wave and the higher the frequency'''
cm_last = '''the shortest wave: neighbours move in opposite directions'''
cp = '''one bump is released: two waves run to the ends, many modes take part'''
cp2 = '''the energy of every mode is constant: the modes do not interact'''
cl = '''two waves meet and pass through each other: free particles'''
cn = '''add anharmonic terms (cubic and quartic) to the Lagrangian: the modes begin to exchange energy'''
cn2 = '''the energy is redistributed among the normal modes: this is the interaction'''
cc = '''N grows, the springs get shorter: the chain becomes a continuous field'''
cc2 = '''the discrete index j becomes the coordinate x, the displacement becomes the field'''
l_cont = '''field: $\omega=ck$'''
l_latt = '''chain'''
delta = '''energy moved to other modes:'''
E = '''mode energy $E_s$'''
disp = '''frequency $\omega_s$'''
mode = '''mode'''
lin = '''linear chain'''
nonlin = '''with anharmonic terms'''
fL = '''$L=\sum_i\left[\frac{1}{2}m\dot{x}_i^2-\frac{1}{2}k\,(x_{i+1}-x_i)^2\right]$'''
fEq = '''$m\ddot{x}_j=k\,(x_{j+1}-2x_j+x_{j-1}),\qquad \ddot{\mathbf{x}}+\Omega\mathbf{x}=0$'''
fM1 = '''$x_j^{(s)}(t)=A\,\sin\frac{s\pi j}{N+1}\,\cos\omega_s t$'''
fM2 = '''$\omega_s=2\sqrt{k/m}\,\sin\frac{s\pi}{2(N+1)}$'''
fP = '''$x_j(0)=g(j-j_0),\quad \dot{x}_j=0\ \Rightarrow\ x=\sum_s c_s\,y_s(t)$'''
fN = '''$L=\sum_i\left[\frac{1}{2}m\dot{x}_i^2-\frac{k}{2}d_i^2-\frac{\alpha}{3}d_i^3-\frac{\beta}{4}d_i^4\right],\quad d_i=x_{i+1}-x_i$'''
fC = '''$\partial_t^2\varphi=c^2\,\partial_x^2\varphi,\qquad \omega=c\,k$'''
f_lin_ghost = '''$E_s=\mathrm{const}$'''

