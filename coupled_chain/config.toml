# Every number of the film "A chain of coupled oscillators" lives here (the script contains only algorithms).
# Override on the command line:  --config other.toml   or   --set style.mass_size=100 --set layout.chain_axes=[0.03,0.30,0.94,0.46]
# Units: "film s" are seconds of the content (the chapter cards are inserted by the timeline), "sites" are the spacings of the chain,
# figure fractions are fractions of the width / height of the frame, font sizes are points at 720 p (they scale with the height).

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 24
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.6
reference_height = 720

[physics]
n = 24                            # the masses (fixed ends, m = 1)
k = 1.0
alpha = 0.45                      # anharmonic bond potential V(d) = k d^2/2 + alpha d^3/3 + beta d^4/4 ; alpha^2 < 3 beta k
beta = 0.09
default_dt = 0.005                # the default step of integrate()
wave_rate = 1.0                   # physical time per film second in the wave chapters
nonlinear_samples_per_s = 30
ghost_samples = 400               # the smooth dashed curve of the linear solution

[physics.packet]
amplitude = 0.40
carrier_k = 1.2
sigma = 2.2
left_j = 6.0
right_j = 19.0

[physics.bump]
centre_j = 8.0
sigma = 1.6
amplitude = 1.0

[timeline]
card_s = 2.0
part_bounds = [0.0, 16.0, 46.0, 62.0, 80.0, 100.0, 112.0]
card_at = [0.0, 0.0, 16.0, 46.0, 62.0, 80.0, 100.0]
card_fade_in = [0.0, 0.16]
card_fade_out = [0.84, 1.0]

[intro]
chain_appear = [0.4, 3.0]
formula1_in = [3.5, 5.0]
formula1_out = [9.0, 10.0]
formula2_in = [10.0, 11.5]
caption_switch = 9.5
sweep_lead = 8.0                  # the masses appear one after another: (progress * (n + lead) - j) / width
sweep_width = 8.0

[modes]
period_s = 8.0                    # film seconds per period of the mode s = 1
amplitude = 3.2
fade_s = 0.8
panels_fade_s = 1.5
list = [                          # s, from, to, caption key
  { s = 1, from = 16.0, to = 25.5, caption = "cm" },
  { s = 2, from = 25.5, to = 32.0, caption = "cm" },
  { s = 4, from = 32.0, to = 37.5, caption = "cm_hi" },
  { s = 9, from = 37.5, to = 41.5, caption = "cm_hi" },
  { s = 0, from = 41.5, to = 46.0, caption = "cm_last" },     # 0 = the highest mode, s = n
]

[pluck]
caption_switch = 9.0

[collision]
height_scale = 2.0

[nonlinear]
caption_switch = 10.0

[limit]
levels = [24, 48, 96, 192]
level_s = 1.8
time_rate = 0.9
time_offset = 0.5
formula_in = [6.0, 7.5]
caption_switch = 7.0
label_switch = [5.5, 7.0]
dispersion_switch = [5.0, 7.0]
springs_max_n = 24                # up to this many masses the chain is drawn with springs, finer ones as a line
field_samples = 600
dot_size = 120.0                  # pt^2 at 720 p of a dot of the 24-mass chain; the area scales as 1 / n
dot_min_size = 4.0
dot_fade = 0.8                    # the dots fade as the field line appears
dot_alpha_fade = 0.85
line_alpha = 0.8
spring_alpha = 0.75
field_line_width = 2.6
chain_line_width = 2.0
n_label_pos = [0.6, 1.72]         # offsets from the right wall (x) and the data y of the "N = ..." label
n_label_size = 15
label_threshold = 0.5            # the label changes from N = ... to N -> infinity at this progress

[spectrum]
y_margin = 1.2
ymax_stride = 15
xlim = [0.2, 0.8]                 # the bars span [xlim[0], n + xlim[1]]
bar_width = 0.72
bar_alpha = 0.85
active_alpha = 0.95
ghost_alpha = 0.45
ghost_width = 1.0
ghost_dash = [3, 2]
baseline_alpha = 0.5
baseline_width = 1.0
title_pos = [0.0, 1.06]
xlabel_pos = [1.0, -0.12]
title_size = 11.5
xlabel_size = 12
delta_pos = [1.0, 1.32]
delta_size = 12

[dispersion]
y_max = 2.25
curve_alpha = 0.8
curve_width = 1.4
cone_alpha = 0.18
cone_width = 1.0
cone_dash = [3, 3]
dot_size_base = 14.0
dot_size_gain = 90.0
dot_alpha_base = 0.35
dot_alpha_gain = 0.65
curve_samples = 200
baseline_alpha = 0.5
baseline_width = 1.0
title_pos = [0.0, 1.06]
xlabel_pos = [1.0, -0.12]
title_size = 11.5
xlabel_size = 12
limit_y_max = 1.7
limit_samples = 100
limit_curve_alpha = 0.8
limit_curve_width = 1.4
limit_line_width = 2.0
limit_line_dash = [4, 3]
limit_label_pos = [0.62, 1.50]
limit_lattice_label_pos = [0.97, 0.52]
limit_label_size = 11

[camera]
xlim_margin = 1.2                 # the chain axes span [-margin, n + 1 + margin] in x
ylim = [-1.9, 1.9]

[chain]
spring_turns = 3
spring_amplitude_px = 8.0
spring_lead_px = 8.5
spring_points = 60
spring_ramp = 0.08
spring_width = 1.3
spring_alpha = 0.75
spring_color = [0.72, 0.78, 0.88]
wall_half_height = 0.9
wall_color = [0.7, 0.75, 0.85]
wall_alpha = 0.8
wall_width = 4.0
mass_size = 120.0                 # pt^2 at 720 p
mass_edge_color = [1.0, 1.0, 1.0, 0.35]
mass_edge_width = 0.6
height_color_scale = 0.7          # the colour saturates at this fraction of the vertical scale
axis_line_alpha = 0.10
axis_line_width = 0.8
axis_line_dash = [2, 4]
ghost_alpha = 0.55
ghost_width = 1.3
ghost_dash = [4, 3]
tag_pos = [0.6, 1.72]
tag_size = 13
spring_lead_max = 0.3             # the straight ends of a spring are at most this fraction of its length

[layout]
chain_axes = [0.03, 0.32, 0.94, 0.44]
spectrum_axes = [0.06, 0.125, 0.42, 0.15]
dispersion_axes = [0.58, 0.125, 0.36, 0.15]
title_pos = [0.03, 0.935]
chapter_label_pos = [0.97, 0.938]
formula_pos = [0.03, 0.835]
formula_row = 0.075
formula_min_alpha = 0.01
caption_pos = [0.03, 0.035]
mode_label_pos = [0.62, 0.835]
card_title_y = 0.52
card_subtitle_y = 0.43
card_number_y = 0.62
card_chapter_y = 0.50
card_chapter_sub_y = 0.41

[fonts]
title = 19
chapter_label = 13
formula = 17
caption = 11.5
mode_label = 17
card_title = 36
card_subtitle = 17
card_number = 54
card_chapter = 32
card_chapter_sub = 16

[style]
background = "#03060c"
text = [0.88, 0.93, 1.0]
dim = [0.60, 0.68, 0.80]
blue = [0.40, 0.72, 1.00]
warm = [1.00, 0.55, 0.40]
gold = [1.00, 0.84, 0.35]
mid = [0.85, 0.88, 0.95]
title_color = [0.9, 0.95, 1.0, 0.95]
card_title_color = [0.92, 0.96, 1.0]
formula_alpha = 0.95
caption_alpha = 0.95
chapter_label_alpha = 0.9
card_number_alpha = 0.9
panel_cutoff = 0.01                # the spectrum and the dispersion are drawn when their opacity exceeds this
