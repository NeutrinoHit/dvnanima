# All the words and formulas of the film (the same keys in both languages); formulas are matplotlib mathtext (LaTeX), words stay outside $...$.

[en]
title = '''Twisted beams: orbital angular momentum'''
sub = '''$\psi=J_m(\kappa\rho)\,e^{i(m\varphi+k_zz-\omega t)},\quad L_z=m\hbar$'''
s1 = '''the phase winds $m$ times around the axis; colour = phase, brightness = $|\psi|$'''
s2 = '''wave fronts are screws with $m$ threads: $m$ turns around the axis per wavelength'''
s3 = '''a spiral phase plate $e^{im\varphi}$ turns a Gaussian beam into a ring with the same winding'''
s4 = '''the sign of $m$ is the direction of the twist (view against $z$); each photon (or particle) carries $L_z=m\hbar$'''
m = '''m'''
dark = '''dark core: $J_m(0)=0$'''
bright = '''bright centre'''
gauss = '''Gaussian beam'''
plate = '''spiral phase plate'''
ring = '''LG beam: ring of radius'''
after = '''behind the plate'''
wheel = '''phase'''
lz = '''$L_z={m}\,\hbar$'''
f1 = '''$\psi=J_m(\kappa\rho)\,e^{\,i(m\varphi+k_zz-\omega t)}$'''
f2 = '''$-i\hbar\,\partial_\varphi\,\psi=m\hbar\,\psi$'''
f3 = '''$m\varphi+k_zz-\omega t=2\pi n$'''
f4 = '''$\mathrm{LG}_0^m\propto\left(\sqrt{2}\rho/w\right)^{|m|}e^{-\rho^2/w^2}e^{im\varphi}$'''
f5 = '''$\rho_{\max}=w\sqrt{|m|/2}$'''
right = '''phase grows counterclockwise'''
left = '''phase grows clockwise'''
t0 = '''plane wave:  m = 0'''

