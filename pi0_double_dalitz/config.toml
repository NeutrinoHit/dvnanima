# Every number of the film "pi0 -> e+ e- e+ e-" lives here (the script contains only algorithms).
# Override on the command line:  --config other.toml   or   --set model.a_amplitude=0.5 --set camera.scale=90
# Units: film seconds; "scene units" are the units of the 3D scene (the photon axis runs from -z_end to z_end); pixel sizes are
# pixels at 720 p (they scale with the height of the frame); font sizes are points at 720 p; positions in [0, 1] are fractions of the frame.

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 19
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.5
reference_height = 720

[timeline]
total = 54.0
scalar_start = 24.0               # the scalar part starts
summary_start = 47.0              # the summary starts
summary_fade_s = 1.0
caption_after_conversion = 0.6    # the first caption lasts until the first conversion plus this
caption_before_second = 0.4       # a caption switches this long before the second event of a part

[model]
a_amplitude = 0.35                # dN/dphi ~ 1 -+ a cos 2phi ; illustrative
conversion_distance = 1.5         # scene units
z_end = 3.1
velocity = 5.0                    # scene units per second
bins = 12
wave_number = 9.0                 # of the field arrows
stretch = 3.5                     # the photon stage of the two slow events is slowed by this factor

[events]
seed = 6
ps_start = 1.5
scalar_offset = 0.5               # the scalar part starts this long after scalar_start
ps_end_margin = 1.5               # the pseudoscalar events end this long before scalar_start
scalar_end_margin = 1.5           # the scalar events end this long before summary_start
slow_event_slowness = 2.6
fast_slowness = 1.0
first_gap = 7.4                   # the first fast event starts this long after the slow one
gap = 0.8                         # the gaps between fast events shrink by `gap_decay` to `gap_min`
gap_decay = 0.94
gap_min = 0.075
first_ps_phi_offset = 0.22        # the first pseudoscalar event has phi = pi/2 + this (fixed to be clear)
first_ps_azimuth = 0.55
first_s_phi = 0.20
first_s_azimuth = 2.1
duration_limit = 1.9              # an event is drawn while its time is below this (units of its slowness)
fade_in = [0.0, 0.1]
fade_out = [1.3, 1.9]
photon_start = 0.05

[camera]
azimuth_deg = 36.0
elevation_deg = 20.0
centre = [0.505, 0.47]            # fraction of the frame
scale = 98.0                      # pixels per scene unit at 720 p
axis_half_length = 3.4
axis_alpha = 0.18
axis_width = 1.0
axis_dash = [3, 5]

[photons]                         # the E and B arrows along the photon paths
arrow_step_slow = 0.2
arrow_step_fast = 0.3
amplitude_slow = 0.62
amplitude_fast = 0.42
first_arrow = 0.12
b_factor = 0.8
field_line_samples = 120
field_line_amplitude = 0.62
field_line_ramp = 0.25
field_line_alpha_e = 0.55
field_line_alpha_b = 0.45
field_line_width = 1.2
arrow_alpha_e = 0.9
arrow_alpha_b = 0.75
arrow_width_e = 2.0
arrow_width_b = 1.4
tip_size = 3.6
line_alpha = 0.55
line_width = 1.4

[pairs]                           # the planes of the pairs and the electrons and positrons
plane_start_factor = 0.55         # the plane starts at conversion_distance * this
plane_half_width = 1.15
plane_alpha = 0.13
plane_edge_alpha = 0.12
plane_edge_width = 0.7
conversion_ramp = 0.15
opening_angle = 0.34              # rad
track_alpha = 0.55
track_width = 2.2
glow_size = 11.0

[triad]                           # the E and B arrows at the photons of the latest event
appear = [0.05, 0.2]              # after the conversion
z = 1.0
length = 0.85
e_width = 2.4
b_width = 2.0
label_offset = 12.0
label_size = 13.0

[particle]
glow_size = 26.0
label_offset = [-46.0, -8.0]
label_size = 15.0
label_color = [0.85, 0.9, 1.0, 0.95]
flash_duration = 0.2
flash_size_base = 30.0
flash_size_gain = 90.0
flash_alpha = 0.9

[dial]
axes = [0.755, 0.60, 0.19, 0.27]
lim = 1.35
