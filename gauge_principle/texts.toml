[en]
title = '''The gauge principle: two friends and a field'''
h0 = '''The gauge principle: two friends and a field'''
h0s = '''why the freedom to choose a phase calls for a field'''
h1 = '''Two friends and a phase'''
h1s = '''the phase of the wave function is a convention'''
h2 = '''Phases in an interference experiment'''
h2s = '''a common phase is invisible, a relative phase is not'''
h3 = '''A convention at every point'''
h3s = '''the free equation stops working'''
h4 = '''The compensating field'''
h4s = '''$D_\mu=\partial_\mu+iqA_\mu$'''
h5 = '''The field strength and the loop'''
h5s = '''what does not depend on the convention'''
h6 = '''Summary'''
h6s = '''from a freedom to an interaction'''

# part 1
theorist = '''theorist'''
experimenter_x = '''experimenter at $x$'''
experimenter_y = '''experimenter at $y$'''
psi_x = '''$\psi(x)$'''
psi_y = '''$\psi(y)$'''
psi_x_new = '''$e^{i\alpha(x)}\psi(x)$'''
psi_y_new = '''$e^{i\alpha(y)}\psi(y)$'''
row_same = '''one convention:'''
row_same_f = '''$|\psi(x)-\psi(y)|=@v@$'''
row_diff = '''their own conventions:'''
row_diff_f = '''$|e^{i\alpha(x)}\psi(x)-e^{i\alpha(y)}\psi(y)|=@v@$'''
question = '''?'''
illustration = '''illustration; the numbers are computed'''
c1a = '''A theorist sends two experimenters to the points $x$ and $y$ to measure the field $\psi$ and reminds them that its phase is a convention'''
c1b = '''Each of them reads the field as a complex number and then sets the phase by his own convention, $\alpha(x)$ and $\alpha(y)$'''
c1c = '''The theorist cannot compare the two numbers: the difference depends on the conventions, and so does the derivative $\partial_\mu\psi$'''

# part 2
f2a = '''$|\psi|^2=\left|\psi_1e^{i\theta_1}+\psi_2e^{i\theta_2}\right|^2$'''
f2b = '''$|\psi|^2$ depends only on the difference $\delta=\theta_1-\theta_2$'''
c2a = '''A particle reaches the screen along two paths; the dials show the phase of the wave on each path (the colour is the phase)'''
c2b = '''Both phases are shifted by the same $\theta$, a change of convention: the dials turn, the fringes stay in place'''
c2c = '''A phase shifter in one path only: the relative phase $\delta$ moves the fringes; after $\delta=2\pi$ the pattern returns'''
c2d = '''Only a phase difference can be observed; a common phase is a convention'''
path1 = '''path 1'''
path2 = '''path 2'''
screen = '''screen'''
wheel = '''phase of $\psi$'''
r_theta1 = '''phase $\theta_1$ on path 1'''
r_theta2 = '''phase $\theta_2$ on path 2'''
r_delta = '''relative phase $\delta$'''
r_change = '''change of the pattern'''
r_shift = '''fringe shift (periods)'''
shifter = '''phase shifter'''

# parts 3 and 4
row_theorist = '''theorist: $\psi(x)$'''
strip_theorist = '''convention $e^{i\alpha}$'''
row_exp_free = '''experimenter: $\psi'=e^{i\alpha(x)}\psi$, free equation'''
row_exp_cov = '''experimenter: $\psi'=e^{i\alpha(x)}\psi$, covariant equation'''
strip_experimenter = '''convention $e^{i\alpha(x)}$'''
row3_grad = '''gradient of the convention $\partial_x\alpha$'''
row3_field = '''compensating field $A_x=-\partial_x\alpha/q$'''
time = '''time $t=@t@$'''
f3a = '''$\psi'(x)=e^{i\alpha(x)}\psi(x),\qquad i\partial_t\psi=-\frac{1}{2m}\partial_x^2\psi$'''
f3b = '''$\mathcal{L}\to\mathcal{L}-\bar\psi\gamma^\mu\psi\,\partial_\mu\alpha$ for the Dirac field'''
c3a = '''Now each experimenter sets the phase independently at every point, $\alpha(x)$: the same state looks different in the two conventions'''
c3b = '''Both packets obey the free equation, but $\partial_x\alpha$ adds momentum to the wave: the experimenter's packet drifts and is distorted'''
c3c = '''One physical state, two predictions: the free equation is not invariant under a local change of phase'''
r3_head_x = '''centre of the packet $\langle x\rangle$'''
r3_theorist = '''theorist'''
r3_experimenter = '''experimenter'''
r3_head_v = '''drift velocity'''
col_sim = '''simulation'''
col_formula = '''formula'''
f4a = '''$D_\mu=\partial_\mu+iqA_\mu,\qquad A_\mu\to A_\mu-\frac{1}{q}\partial_\mu\alpha$'''
f4b = '''$D_\mu\psi\to e^{i\alpha}D_\mu\psi,\qquad \mathcal{L}=\bar\psi\,(i\hat{D}-m)\,\psi$'''
c4a = '''To compare phases at different points the theorist needs a rule of transport: a field $A_\mu$ that says how the phase changes from point to point'''
c4b = '''With the covariant derivative the equation for $\psi'$ keeps its form: the packet follows the theorist's prediction exactly'''
c4c = '''$D_\mu\psi$ transforms like $\psi$, the naive $\partial_\mu\psi$ does not; expanding $\bar\psi i\hat{D}\psi$ gives the interaction $-q\,\bar\psi\gamma^\mu\psi A_\mu$'''
r4_head_rho = '''mismatch of $|\psi'|^2$ and $|\psi|^2$'''
r4_head_dn = '''mismatch of $\partial\psi'$ and $e^{i\alpha}\partial\psi$'''
r4_head_dc = '''mismatch of $D\psi'$ and $e^{i\alpha}D\psi$'''

# part 5
f5a = '''$F_{\mu\nu}=\partial_\mu A_\nu-\partial_\nu A_\mu\ \to\ F_{\mu\nu}$'''
f5b = '''$e^{-iq\oint A_\mu dz^\mu}=e^{-iq\int F_{12}\,dx\,dy}$'''
c5a = '''A pure-gauge field $A_\mu=-\partial_\mu\alpha/q$: arrows everywhere, but $F_{\mu\nu}=0$, every loop gives zero and the fringes do not move'''
c5b = '''A thin flux tube appears: $F_{\mu\nu}\neq0$ inside it, the loop around it gives $q\Phi$, and the fringes move though $F_{\mu\nu}\approx0$ on both paths'''
c5c = '''A new convention $\alpha(x,y)$ rewrites every arrow, but not $F_{\mu\nu}$, not the loops and not the fringes: the loop phase is observable'''
panel_a = '''gauge field $A_\mu$ (arrows)'''
panel_f = '''field strength $F_{12}$'''
panel_screen = '''screen'''
f_zero = '''$F_{12}=0$'''
loop1 = '''1'''
loop2 = '''2'''
r5_loop1 = '''loop 1: $q\oint A_\mu dz^\mu$'''
r5_flux1 = '''loop 1: $q\int F_{12}\,dx\,dy$'''
r5_loop2 = '''loop 2: $q\oint A_\mu dz^\mu$'''
r5_df = '''change of $F_{12}$ (in units of its peak)'''
r5_shift = '''central fringe shift: $@s@$'''

# part 6
e0 = '''a local choice of phase $\Rightarrow$ the field $A_\mu$ $\Rightarrow$ the interaction'''
e1 = '''$D_\mu=\partial_\mu+iqA_\mu,\qquad A_\mu\to A_\mu-\frac{1}{q}\partial_\mu\alpha$'''
e2 = '''$\mathcal{L}=\bar\psi\,(i\hat{\partial}-m)\,\psi\ -\ q\,\bar\psi\gamma^\mu\psi\,A_\mu\ -\ \frac{1}{4}F_{\mu\nu}F^{\mu\nu}$'''
e3 = '''This is the Lagrangian of quantum electrodynamics:
the field $A_\mu$ couples to the current $\bar\psi\gamma^\mu\psi$'''
e4 = '''The same logic with larger groups of local transformations, $SU(2)$ and $SU(3)$,
leads to the Yang–Mills theories of the weak and strong interactions'''

