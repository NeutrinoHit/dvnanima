# Every number of the film "The gauge principle: two friends and a field" lives here (the scripts contain only algorithms).
# Override on the command line:  --config other.toml   or   --set chain.alpha_slope=2.0 --set plane.flux_over_pi=0.5
# Units: "content s" are seconds of the film without the chapter cards (the timeline inserts the cards); times inside a part are measured from the start of the part;
# the positions of the panels are fractions of the width / height of the frame, "data" units belong to the axes they are drawn in; font sizes are points at 720 p.

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 24
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.6
reference_height = 720

[timeline]
card_durations = [2.0, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]      # the film title, then one card before each of the six parts
part_bounds = [0.0, 15.0, 30.0, 44.0, 59.0, 77.0, 86.0]   # content time: parts 1 .. 6
card_at = [0.0, 0.0, 15.0, 30.0, 44.0, 59.0, 77.0]
card_fade_in = [0.0, 0.16]
card_fade_out = [0.84, 1.0]

