# All the words and formulas of the film (the same keys in both languages); formulas are matplotlib mathtext (LaTeX), words stay outside $...$.

[en]
title = '''The relativity of simultaneity'''
sub = '''Minkowski diagram, $c=1$'''
O = '''frame $O$'''
Op = '''frame $O'$ (moves with $v$)'''
x = '''$x$'''
ct = '''$ct$'''
ctp = '''$ct'$'''
xp = '''$x'$'''
cap_intro = '''three flashes $A$, $B$, $C$ at the same moment $t=0$ in the frame $O$'''
cap0 = '''$v=0$: the line of simultaneity is horizontal; all three flashes are simultaneous'''
cap1 = '''the line of simultaneity of $O'$ is tilted: for $v>0$ the flash $C$ comes first, then $B$, then $A$'''
capr = '''the faster $O'$ moves, the more tilted its line of simultaneity'''
cap2 = '''for $v<0$ the order is reversed: $A$, $B$, $C$'''
cap3 = '''a spacelike pair $(P,R)$ changes its order with $v$; a timelike pair $(P,Q)$ never does'''
cap4 = '''the order of events depends on the frame only if no signal can connect them: causality is safe'''
formula = '''$t'_i=\gamma\,(t_i-v x_i)=-\gamma\,v\,x_i$'''
formula2 = '''$\Delta t'=\gamma\,(\Delta t-v\,\Delta x)$'''
order = '''order in $O'$'''
simul = '''simultaneous'''
space = '''spacelike'''
time = '''timelike'''
light = '''light cone'''
always = '''always'''
dep = '''depends on $v$'''
first = '''first'''

