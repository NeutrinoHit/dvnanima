# Every number of the film "Spin and orbital structure of the f fbar pair in Higgs decays" lives here (the scripts contain only algorithms).
# Override on the command line:  --config other.toml   or   --set iso.elevation_deg=40 --set palette.hue_period_s=8
# Units: "film s" are seconds of the content (the chapter cards are inserted by the timeline), lengths of the physics are in 1/p
# (x = p r), positions of the layout are fractions of the width / height of the frame, font sizes and pixel sizes are points / pixels
# at 720 p (they scale with the height of the frame).

[video]
width = 1280
height = 720
fps = 30
dpi = 100
crf = 22
preset = "slow"
preview_width = 640
preview_height = 360
preview_fps = 15
fade_s = 0.6
reference_height = 720

[physics]
beta = 0.996                       # p / E of the fermion (a b quark in the decay of the Higgs boson)
p_phase_deg = -90.0                # the phase of the P-wave amplitude psi_P: -90 degrees = -i (the sign convention of Eq. (B4), see ffbar.py)
spin_axis = [0.0, 0.0, 1.0]        # the common axis s of the spin projections (parts 2 and 3)
mixed_xi1 = [1.0, 0.0, 0.0]        # the spin directions of the mixed state (part 4): xi_1 and xi_2 perpendicular
mixed_xi2 = [0.0, 1.0, 0.0]

[iso]                              # the surfaces |psi|^2 = const (units N^2) of the cells
elevation_deg = 32.0
azimuth_deg = -55.0
r_max = 5.0                        # the window of the physics, x = p r
view = 4.6                         # half-width of the picture in x
mix_r_max = 6.4                    # the same for the mixed state of the part 4 (its cloud is longer)
mix_view = 5.4
levels = [0.05, 0.10]              # |psi|^2 / N^2 of the outer (translucent) and the inner surface
alphas = [0.30, 1.0]
samples = 112                      # points along a ray
supersample = 2
edge = 1.0
grad_step = 0.001
ambient = 0.34
diffuse = 0.60
specular = 0.30
spec_power = 24.0
light = [-0.45, 0.55, 0.70]        # components along (screen right, screen up, towards the camera)

[palette]
offset = 0.58                      # c_ch(phi) = offset + amp cos(phi - 2 pi ch / 3)
amp = 0.42
hue_period_s = 5.0                 # film seconds per turn of the common phase exp(-i omega t)

[wheel]
pixels = 96
inner = 0.58
label_gap = 4.0
label_size = 9.5

[glyph]
length = 34.0                      # spin arrows (pixels at 720 p)
gap = 26.0
width = 2.4
head = 9.0
head_aspect = 0.42
head_overlap = 0.8
label_gap = 3.0
label_size = 11.0
triad_scale = 42.0
triad_label_gap = 10.0

[overlay]                          # axis, ring, probe and winding arrow drawn over a cell (lengths in x)
alpha = 0.45
width = 1.0
dash = [3.0, 3.0]
ring_radius = 4.0
ring_points = 121
axis_length = 4.5
axis_head = 0.6
head = 7.0
axis_label_dx = 10.0
axis_label_dy = 2.0
label_size = 12.0
arc_start_deg = -30.0
arc_span_deg = 250.0
arc_z = 0.0
arc_width = 2.0
arc_head = 9.0
probe_azimuth_offset_deg = 70.0
probe_length = 3.8
probe_width = 2.2
probe_head = 9.0
probe_dot = 40.0
axis_arrow_length = 3.8
theta_radius = 1.6
theta_points = 30
theta_alpha = 0.8
theta_width = 1.4
arc_min_deg = 3.0

[plot]                             # the small plots
axis_alpha = 0.8
axis_width = 1.0
tick = 4.0
tick_gap = 2.0
tick_size = 10.0
label_size = 11.0
curve_width = 2.0
xlabel_dx = 6.0
ylabel_rise = 4.0
samples = 200
dot = 36.0
value_dx = 7.0
value_dy = 7.0
value_size = 11.0
dash = [4.0, 3.0]
avg_alpha = 0.9
flip_fraction = 0.7                # the value label is drawn left of the dot beyond this fraction of the axis

[partial_sums]
n_directions = 2048                # plane waves added in the part 1 (a Halton set on the sphere)
grid = 300
half_width = 8.0                   # the panel shows |x|, |y| <= half_width
start_s = 0.8
octave_s = 0.8                     # film seconds for doubling the number of the plane waves

[timeline]
card_s = 1.7
part_bounds = [0.0, 16.0, 48.0, 61.0, 83.0, 95.0]
card_at = [0.0, 0.0, 16.0, 48.0, 61.0, 83.0]
card_fade_in = [0.0, 0.16]
card_fade_out = [0.84, 1.0]

[fonts]
title = 18
chapter_label = 12.5
formula = 16.5
caption = 13
header = 14
header_small = 11
theta = 14
note = 11.5
zero = 14
card_title = 32
card_subtitle = 17
card_number = 54
card_chapter = 30
card_chapter_sub = 16

[layout]
title_pos = [0.03, 0.945]
title_maxw = 0.56
chapter_label_pos = [0.97, 0.945]
formula_pos = [0.03, 0.875]
formula_row = 0.05
formula_maxw = 0.94
