condensate_line = '''condensate, $m_A=ev$'''
stage_axis = '''$x$ in units of $1/m_A$'''
no_wave = '''no wave'''
disp_title = '''$\omega$ vs $k$ (units of $m_A$)'''
k_axis = '''$k$'''
gap = '''gap'''
zoom_title = '''the boundary, zoomed'''
tail_label = '''tail $e^{-\kappa x}$'''
world_title = '''packet centre $x_c(t)$'''
t_axis = '''time'''
c_line = '''light, $v=c$'''
vg_line = '''$v_g=k/\omega$'''
analytic = '''formula'''
simulation = '''simulation'''
row_depth = '''depth $1/\kappa\ (1/m_A)$'''
row_reflected = '''reflected energy'''
row_k = '''wave number $k/m_A$'''
row_vg = '''$v_g$ (in $c$)'''
row_transmitted = '''transmitted energy'''

# part 3
c3a = '''in vacuum $\omega=k$ (the light cone); in the condensate $\omega^2=k^2+m_A^2$: there are no waves below $\omega=m_A$'''
c3b = '''the slope of the curve is the group velocity $v_g=k/\omega<1$; for $k\gg m_A$ it tends to the speed of light'''
c3c = '''a massless photon has two transverse polarizations'''
c3d = '''a massive vector field has three: the third, longitudinal, comes from the Goldstone mode of the condensate'''
c3e = '''the Goldstone mode is eaten by the gauge field; the total number of degrees of freedom is conserved'''
c3f = '''after the breaking the spectrum has a massive vector field ($m_A=ev$) and a massive scalar $\chi$'''
f3a = '''$\omega^2=k^2+m_A^2$'''
f3b = '''$v_g=\frac{d\omega}{dk}=\frac{k}{\omega}$'''
disp3_title = '''frequency $\omega$ vs wave number $k$ (units of $m_A$)'''
cone_label = '''vacuum: $\omega=k$'''
hyper_label = '''condensate: $\omega^2=k^2+m_A^2$'''
mA_label = '''$m_A$'''
triad_massless = '''massless photon: 2 polarizations'''
triad_massive = '''massive photon: 3 polarizations'''
dof_title = '''degrees of freedom'''
dof_phi = '''complex field $\phi$'''
dof_A0 = '''massless $A^\mu$'''
dof_chi = '''real field $\chi$'''
dof_A3 = '''massive $A^\mu$'''
goldstone = '''Goldstone mode'''
pol_trans = '''transverse'''
pol_long = '''longitudinal'''
packet1 = '''packet 1'''
packet2 = '''packet 2'''

