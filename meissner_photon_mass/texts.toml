h1s = '''a condensate expels the magnetic field'''
h2 = '''A wave packet at the boundary'''
h2s = '''reflection below the gap, transmission above'''
h3 = '''Dispersion and polarizations'''
h3s = '''$\omega^2=k^2+m_A^2$, and two polarizations become three'''

# part 1
c1a = '''a uniform magnetic field $B_0$ and a disc of the future condensate: the field does not notice it yet'''
c1b = '''the condensate forms ($v$ grows): the field lines are pushed out; every frame is the equilibrium field for the current $v$'''
c1c = '''inside the condensate the field decays as $e^{-x/\lambda_L}$: the screening current $j=-m_A^2A$ flows in a layer of thickness $\lambda_L$'''
c1d = '''the photon in the condensate is massive, $m_A=ev$: the field penetrates only to the depth $\lambda_L=1/m_A$'''
f1a = '''$\nabla\times\mathbf{B}=\mathbf{j}=-m_A^2\mathbf{A}\ \Rightarrow\ \nabla^2\mathbf{A}=m_A^2\mathbf{A},\qquad m_A=ev$'''
f1b = '''$B(x)=B_0\,e^{-x/\lambda_L},\qquad \lambda_L=\frac{1}{m_A}$'''
condensate = '''condensate'''
phi2 = '''$|\phi|^2=v^2/2$'''
B0 = '''$\mathbf{B}_0$'''
Babs = '''$|\mathbf{B}|$'''
growth = '''condensate $v$'''
prof_title = '''field along the cut, $B_\parallel/B_0$'''
vacuum = '''vacuum'''
depth = '''depth $x$'''
current = '''$\odot\ \otimes$ screening current $\mathbf{j}=-m_A^2\mathbf{A}$'''

# part 2
c2a = '''a wave packet of the gauge field runs towards the condensate; its frequency $\omega=@omega@\,m_A$ is below the gap'''
c2b = '''$\omega<m_A$: a wave cannot propagate in the condensate; the packet is reflected, only an evanescent tail enters'''
c2c = '''the tail decays as $e^{-\kappa x}$ over $1/\kappa=1/\sqrt{m_A^2-\omega^2}$; for $\omega\to0$ this is the London depth $1/m_A$'''
c2d = '''a packet above the gap, $\omega=@omega@\,m_A$, enters the condensate: the wavelength grows, the packet slows down'''
c2e = '''inside, the packet moves with the group velocity $v_g=k/\omega=@vg@$ (in units of $c$); the condensate is a fixed background'''
f2a = '''$\left(\partial_t^2-\partial_x^2+m_A^2(x)\right)A=0,\qquad m_A(x)=m_A\,\Theta(x)$'''
f2b = '''$\omega<m_A:\quad A\propto e^{-\kappa x},\qquad \kappa=\sqrt{m_A^2-\omega^2}$'''
f2c = '''$\omega>m_A:\quad k=\sqrt{\omega^2-m_A^2},\qquad v_g=\frac{d\omega}{dk}=\frac{k}{\omega}<1$'''
